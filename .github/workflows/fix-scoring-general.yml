name: Inspect missed return inference path

on:
  push:
    branches:
      - revert_1

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Print functions containing ownership state
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          tree = ast.parse(text)
          needles = ('INFERRED_RETURN_OWNER', '_side_recross_hitter', '_record_racket_contact', '_serve_landed_in_current_attempt')
          for node in ast.walk(tree):
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              body = '\n'.join(lines[node.lineno-1:node.end_lineno])
              if any(n in body for n in needles):
                  print(f'===== {node.name} lines {node.lineno}-{node.end_lineno} =====')
                  print(body)
          PY
