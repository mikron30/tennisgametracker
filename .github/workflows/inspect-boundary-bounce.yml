name: Inspect boundary bounce logic

on:
  push:
    branches:
      - revert_1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Show exact point-end and far-boundary functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          needles = [
              'PLAYER-REACQ END SUPPRESSED',
              'TOP-FAR-OUT TURN',
          ]
          for needle in needles:
              print('\n===== NEEDLE:', needle, '=====')
              hits = [i for i, line in enumerate(lines) if needle in line]
              for idx in hits:
                  fn = idx
                  while fn >= 0 and not lines[fn].lstrip().startswith('def '):
                      fn -= 1
                  print('HIT', idx + 1, 'FUNCTION', lines[fn].strip() if fn >= 0 else 'UNKNOWN')
                  start = max(fn, idx - 90) if fn >= 0 else max(0, idx - 90)
                  end = min(len(lines), idx + 130)
                  for n in range(start, end):
                      print(f'{n+1:05d}: {lines[n]}')
          PY
