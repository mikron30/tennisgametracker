name: Export analyzer source
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/export_analyzer_source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - uses: actions/upload-artifact@v4
        with:
          name: analyzer-source
          path: interactive_ball_analyzer.py
