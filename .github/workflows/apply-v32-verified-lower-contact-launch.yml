name: Apply V32 verified lower-contact launch release

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0

      - name: Apply V32 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')

          if '[CONTACT_LOCAL_AI VERIFIED-LOWER-LAUNCH RELEASE]' in text:
              print('V32 already applied')
              raise SystemExit(0)

          old_commit = """        recovery_label = candidate.get('recovery_label', 'NIGHT VISIBLE BALL RECOVER')
        print(
            f\"Frame {self.frame_count}: [{recovery_label}] Ball at {new_pos} \"
"""
          new_commit = """        recovery_label = candidate.get('recovery_label', 'NIGHT VISIBLE BALL RECOVER')
        # V32: remember an explicit normal-path lower-contact launch for this
        # exact frame.  Contact Local-AI may still inspect ordinary suspicious
        # HSV proposals, but it must not roll back a launch already verified by
        # the dedicated contact-continuation geometry.  The marker is frame-local
        # and therefore cannot weaken later Contact Local-AI protection.
        if (
                recovery_label == 'NIGHT LOWER CONTACT LAUNCH' and
                candidate.get('source') != 'local_ai_tight_roi'
        ):
            self._last_verified_lower_contact_launch_frame = int(self.frame_count)
        print(
            f\"Frame {self.frame_count}: [{recovery_label}] Ball at {new_pos} \"
"""
          if text.count(old_commit) != 1:
              raise SystemExit(f'expected one recovery-label marker, found {text.count(old_commit)}')
          text = text.replace(old_commit, new_commit, 1)

          old_arb = """                            tracked_position = self.track_ball_in_frame(frame)
                            contact_reason = self._contact_local_ai_trigger(
                                prev_ball_center, tracked_position, pre_track_snapshot
                            )
                            if contact_reason is not None:
"""
          new_arb = """                            tracked_position = self.track_ball_in_frame(frame)
                            verified_lower_contact_launch = (
                                tracked_position is not None and
                                int(getattr(
                                    self,
                                    '_last_verified_lower_contact_launch_frame',
                                    -1000000,
                                )) == int(self.frame_count)
                            )
                            if verified_lower_contact_launch:
                                # V31's reviewed first rally reaches a real outbound
                                # ball at f179 through NIGHT LOWER CONTACT LAUNCH.
                                # The local model misses that frame; the old fallback
                                # then restored the pre-track snapshot and stale
                                # near-player anchor, poisoning ~20 subsequent frames.
                                # An explicit lower-contact launch is stronger evidence
                                # than an AI miss, so release Contact Local-AI without
                                # touching the already-committed normal tracking state.
                                self._contact_local_ai_state = None
                                self._contact_local_ai_cooldown_until_frame = max(
                                    int(getattr(
                                        self,
                                        '_contact_local_ai_cooldown_until_frame',
                                        -1000000,
                                    )),
                                    int(self.frame_count) + 2,
                                )
                                self._contact_normal_fallback_path = []
                                contact_reason = None
                                print(
                                    f\"[CONTACT_LOCAL_AI VERIFIED-LOWER-LAUNCH RELEASE] \"
                                    f\"f{self.frame_count}: preserving normal launch=\"
                                    f\"{tuple(tracked_position)}\"
                                )
                            else:
                                contact_reason = self._contact_local_ai_trigger(
                                    prev_ball_center, tracked_position, pre_track_snapshot
                                )
                            if contact_reason is not None:
"""
          if text.count(old_arb) != 1:
              raise SystemExit(f'expected one Contact Local-AI arbitration block, found {text.count(old_arb)}')
          text = text.replace(old_arb, new_arb, 1)

          path.write_text(text, encoding='utf-8')
          print('Applied V32 verified lower-contact launch release')
          PY

      - name: Validate V32 patch
        shell: bash
        run: |
          python -m py_compile interactive_ball_analyzer.py
          python - <<'PY'
          from pathlib import Path
          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          assert "_last_verified_lower_contact_launch_frame" in text
          assert "[CONTACT_LOCAL_AI VERIFIED-LOWER-LAUNCH RELEASE]" in text
          assert "recovery_label == 'NIGHT LOWER CONTACT LAUNCH'" in text
          assert "candidate.get('source') != 'local_ai_tight_roi'" in text
          print('V32 verified lower-contact launch release present')
          PY
          git diff --check
          git diff -- interactive_ball_analyzer.py

      - name: Commit patched tracker
        shell: bash
        run: |
          if git diff --quiet -- interactive_ball_analyzer.py; then
            echo "No tracker changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Apply V32 verified lower-contact launch release"
          git push origin HEAD:codex/shallow-serve-turn-candidate
