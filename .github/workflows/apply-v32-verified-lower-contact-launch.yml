name: Apply V32 verified lower-contact launch release

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0

      - name: Apply V32 patch
        run: python tools/apply_v32_verified_lower_contact_launch_release.py

      - name: Validate patched tracker
        shell: bash
        run: |
          python -m py_compile interactive_ball_analyzer.py
          python - <<'PY'
          from pathlib import Path
          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          assert "_last_verified_lower_contact_launch_frame" in text
          assert "[CONTACT_LOCAL_AI VERIFIED-LOWER-LAUNCH RELEASE]" in text
          assert "recovery_label == 'NIGHT LOWER CONTACT LAUNCH'" in text
          assert "candidate.get('source') != 'local_ai_tight_roi'" in text
          print('V32 verified lower-contact launch release present')
          PY
          git diff --check
          git diff -- interactive_ball_analyzer.py

      - name: Commit patched tracker
        shell: bash
        run: |
          if git diff --quiet -- interactive_ball_analyzer.py; then
            echo "No tracker changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Apply V32 verified lower-contact launch release"
          git push origin HEAD:codex/shallow-serve-turn-candidate
