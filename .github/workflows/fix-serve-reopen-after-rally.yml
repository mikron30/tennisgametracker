name: One-shot stale serve state fix

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch stale serve state
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_stale_serve.py
          python /tmp/patch_stale_serve.py
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          grep -q "touch_from_initial_serve" interactive_ball_analyzer.py
          grep -q "frames_since_point_start > 45" interactive_ball_analyzer.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-serve-reopen-after-rally.yml
          git add interactive_ball_analyzer.py
          git commit -m "Prevent stale serve state during rally"
          git push origin HEAD:revert_1
