name: Fix contact AI consensus

on:
  push:
    branches: [codex-ai-recovery-wip]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-ai-recovery-wip
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Patch first-frame contact AI consensus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')
          old_comment = '''        # CONTACT_LOCAL_AI_POST_SERVE_CONSENSUS_V1
        # On the verified serve-launch frame the normal tracker has already
        # produced an airborne candidate. If Local AI independently gives a
        # candidate at essentially the same position a score tied with its
        # best candidate, prefer that cross-detector agreement over the
        # anchor-distance tie-break. This is intentionally limited to the
        # short post-serve launch lock and only when no AI trajectory exists
        # yet. Candidate size/area is not used here.'''
          new_comment = '''        # CONTACT_LOCAL_AI_FIRST_FRAME_CONSENSUS_V2
        # On the first Local-AI frame, the normal tracker has independently
        # produced the contact hypothesis that armed AI. If AI also finds a
        # near-identical candidate with a score tied with its best candidate,
        # prefer that cross-detector agreement over anchor distance. This is
        # intentionally limited to the first AI step (predicted is None), so a
        # later bad HSV hypothesis cannot steer an established AI trajectory.'''
          if old_comment not in text:
              raise SystemExit('consensus comment not found')
          text = text.replace(old_comment, new_comment, 1)

          old_condition = '''        if (
                debug_normal_candidate is not None and
                eligible and
                predicted is None and
                current <= int(getattr(self, "_post_serve_launch_lock_until_frame", -1))):'''
          new_condition = '''        if (
                debug_normal_candidate is not None and
                eligible and
                predicted is None):'''
          if old_condition not in text:
              raise SystemExit('consensus condition not found')
          text = text.replace(old_condition, new_condition, 1)

          old_init = '''        # Debug-only reference to the normal HSV/contact candidate that caused
        # CONTACT_LOCAL_AI to arm. It is populated only while Local AI ranks
        # that same frame and never participates in candidate selection.'''
          new_init = '''        # Reference to the normal HSV/contact candidate that caused
        # CONTACT_LOCAL_AI to arm. It exists only while Local AI ranks that
        # same first frame and may break a near-tie in favour of independent
        # HSV+AI agreement; it never steers later AI-history frames.'''
          if old_init not in text:
              raise SystemExit('normal candidate init comment not found')
          text = text.replace(old_init, new_init, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_ai_physical_validation.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''        self.assertEqual(analyzer.last_motion['distance'], 10)\n\n\nif __name__ == '__main__':\n'''
          addition = '''        self.assertEqual(analyzer.last_motion['distance'], 10)\n\n    def test_first_contact_frame_prefers_ai_candidate_confirming_normal_tracker(self):\n        analyzer = InteractiveBallAnalyzer.__new__(InteractiveBallAnalyzer)\n        analyzer._force_local_ai_range = (4100, 4110)\n        analyzer._force_local_ai_history = []\n        analyzer.ball_center = (2214, 860)\n        analyzer.ball_velocity_history = [31.3, 38.2, 39.2, 46.3, 35.8]\n        analyzer.last_motion = {'dx': -16, 'dy': 32, 'distance': 35.8}\n        analyzer._contact_local_ai_debug_normal_candidate = (2141, 743)\n        analyzer._player_point_zone = lambda point: None\n        analyzer._candidate_motion_metrics = lambda *a, **k: {'mean': 20., 'max': 100.}\n\n        class Scorer:\n            _config = {}\n            def _score(self, *args):\n                return [\n                    {'x': 2221, 'y': 924, 'area': 225., 'ai_score': 1.0},\n                    {'x': 2139, 'y': 740, 'area': 521., 'ai_score': 1.0},\n                    {'x': 2217, 'y': 924, 'area': 220., 'ai_score': 0.999996},\n                ]\n\n        analyzer.local_ai_recovery = Scorer()\n        analyzer.frame_count = 4100\n        candidates = [\n            {'x': 2221, 'y': 924},\n            {'x': 2139, 'y': 740},\n            {'x': 2217, 'y': 924},\n        ]\n        with patch('ball_ai_recovery_probe.collect_candidates', return_value=candidates):\n            selected = analyzer._force_local_ai_frame(\n                np.zeros((1200, 2400, 3), np.uint8), (2214, 860)\n            )\n        self.assertEqual(selected, (2139, 740))\n        self.assertEqual(analyzer._force_local_ai_history[-1]['pos'], (2139, 740))\n\n\nif __name__ == '__main__':\n'''
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          tests = tests.replace(marker, addition, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Run focused regressions
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py
          python -m unittest tests.test_ai_physical_validation tests.test_ball_local_ai_recovery tests.test_retro_let_scoring tests.test_serve_side_consistency
          python -m pytest -q tests/test_recovered_serve_scoring.py
          git diff --check
      - name: Commit validated fix
        run: |
          rm -f .github/workflows/fix-contact-ai-consensus.yml
          git config user.name 'chatgpt-ai-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A interactive_ball_analyzer.py tests/test_ai_physical_validation.py .github/workflows/fix-contact-ai-consensus.yml
          git commit -m 'Prefer corroborated contact AI candidate on first frame'
          git push origin HEAD:codex-ai-recovery-wip
