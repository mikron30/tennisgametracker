name: Inspect V26 pending OUT context

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate
    paths:
      - .github/workflows/inspect-v26-pending-out.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0

      - name: Extract pending OUT context
        shell: python
        run: |
          from pathlib import Path

          source = Path('interactive_ball_analyzer.py')
          lines = source.read_text(encoding='utf-8').splitlines()
          needles = [
              'def _detect_out_of_court_bounce',
              'OUT-BOUNCE PENDING REBOUND REJECT',
              'OUT-BOUNCE PENDING CONFIRMED',
          ]
          hits = []
          for needle in needles:
              for i, line in enumerate(lines):
                  if needle in line:
                      hits.append((needle, i))
                      break
          if len(hits) < 2:
              raise SystemExit(f'pending OUT markers not found: {hits}')

          lo = max(0, min(i for _, i in hits) - 100)
          hi = min(len(lines), max(i for _, i in hits) + 100)
          out = [
              '# V26 pending OUT source context',
              '',
              '```python',
          ]
          for j in range(lo, hi):
              out.append(f'{j + 1:06d}: {lines[j]}')
          out.extend(['```', ''])
          Path('V26_OUT_SOURCE_CONTEXT.md').write_text('\n'.join(out), encoding='utf-8')

      - name: Commit source context
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V26_OUT_SOURCE_CONTEXT.md
          git commit -m "Record V26 pending OUT source context"
          git push origin HEAD:codex/shallow-serve-turn-candidate
