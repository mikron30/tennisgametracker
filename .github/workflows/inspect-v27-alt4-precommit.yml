name: Inspect V27 ALT4 precommit

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate
    paths:
      - .github/workflows/inspect-v27-alt4-precommit.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0
      - name: Extract ALT4 precommit context
        shell: python
        run: |
          from pathlib import Path
          p=Path('interactive_ball_analyzer.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=['ALT4 HSV OVERRIDE', 'Direction change candidate', 'Movement {velocity']
          out=['# V27 ALT4 precommit context','']
          seen=[]
          for needle in needles:
              hits=[i for i,l in enumerate(lines) if needle in l]
              for i in hits[:5]:
                  lo=max(0,i-130); hi=min(len(lines),i+150)
                  key=(lo,hi)
                  if key in seen: continue
                  seen.append(key)
                  out += [f'## {needle} around source line {i+1}','```python']
                  out += [f'{j+1:06d}: {lines[j]}' for j in range(lo,hi)]
                  out += ['```','']
          if not seen: raise SystemExit('markers not found')
          Path('V27_ALT4_PRECOMMIT_CONTEXT.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
      - name: Commit context
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V27_ALT4_PRECOMMIT_CONTEXT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V27 ALT4 precommit context"
          git push origin HEAD:codex/shallow-serve-turn-candidate
