name: Apply V28 player reacquisition visible conflict

on:
  push:
    paths:
      - '.github/workflows/apply-v28-player-reacq-visible-conflict.yml'
      - 'tools/apply_v28_player_reacq_visible_conflict.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0

      - name: Apply V28 patch
        run: python tools/apply_v28_player_reacq_visible_conflict.py

      - name: Validate patched tracker
        shell: bash
        run: |
          python -m py_compile interactive_ball_analyzer.py
          python - <<'PY'
          from pathlib import Path
          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          assert '[PLAYER-REACQ STRONG-MOTION VISIBLE-CONFLICT REANCHOR]' in text
          assert "player_reacq_selected_area >= 120.0" in text
          assert "visible_s >= player_reacq_selected_s + 15" in text
          assert "return self._commit_night_visible_ball_recovery(" in text
          print('V28 visible-conflict guard present')
          PY
          git diff --check
          git diff -- interactive_ball_analyzer.py

      - name: Commit patched tracker
        shell: bash
        run: |
          if git diff --quiet -- interactive_ball_analyzer.py; then
            echo "No tracker changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Apply V28 player reacquisition visible conflict guard"
          git push origin HEAD:codex/shallow-serve-turn-candidate
