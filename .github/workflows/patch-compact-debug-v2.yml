name: Patch compact debug v2
on:
  push:
    branches: [revert_1]
    paths:
      - '.github/scripts/patch_compact_debug_v2.py'
      - '.github/workflows/patch-compact-debug-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Apply compact logging v2 patch
        run: python .github/scripts/patch_compact_debug_v2.py
      - name: Validate
        run: |
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          grep -n "retrack_using_alt2 skipping" interactive_ball_analyzer.py | head -2
          grep -n "TOP-RETURN WAIT.*ignoring non-reentry" interactive_ball_analyzer.py | head -2
      - name: Commit compact logging v2 and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/patch_compact_debug_v2.py
          rm -f .github/workflows/patch-compact-debug-v2.yml
          git add -A
          git commit -m "Reduce repetitive tracker console output"
          git push origin HEAD:revert_1
