name: Apply player zone debug

on:
  push:
    branches: [revert_1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Patch player shoe-zone diagnostics
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-player-zone-debug.yml
          git add player_racket_tracker.py .github/workflows/apply-player-zone-debug.yml
          git commit -m 'Add player shoe-zone diagnostics'
          git push origin HEAD:revert_1
