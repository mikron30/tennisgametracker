name: Inspect far hit artifact
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_far_hit_artifact.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Build focused source report
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('interactive_ball_analyzer.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          needles = [
              '_last_racket_contact_player', '_last_racket_contact_frame',
              '_last_racket_contact_point', 'PLAYER_SHOT', 'RALLY_HIT',
              'racket contact', 'inferred return', 'large lower-court launch',
              'upper slow-arc continuation', 'far-side', 'far side',
              '_record_player', '_register_rally', '_record_rally',
              '_detect_player_shot', '_detect_racket', '_point_contact_info',
              '_infer_point_outcome'
          ]
          matches=[]
          for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                  matches.append(i)
          ranges=[]
          for i in matches:
              lo=max(0,i-35); hi=min(len(lines),i+55)
              if ranges and lo <= ranges[-1][1] + 8:
                  ranges[-1]=(ranges[-1][0], max(ranges[-1][1],hi))
              else:
                  ranges.append((lo,hi))
          out=[]
          out.append(f'total_lines={len(lines)} matches={len(matches)} ranges={len(ranges)}')
          for lo,hi in ranges:
              out.append(f'\n===== lines {lo+1}-{hi} =====')
              for j in range(lo,hi):
                  out.append(f'{j+1}: {lines[j]}')
          Path('far_hit_inspection.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: far-hit-inspection
          path: far_hit_inspection.txt
