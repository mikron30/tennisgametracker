name: Apply missed far return fix
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_far_hit_artifact.yml']
permissions:
  contents: write
jobs:
  apply_fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patches/fix_missing_far_return.py
      - name: Validate
        run: |
          python -m py_compile interactive_ball_analyzer.py
          python .github/patches/fix_missing_far_return.py --test
          git diff --check
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix_missing_far_return.yml
          rm -f .github/workflows/inspect_far_hit_artifact.yml
          rm -f .github/workflows/inspect_far_hit.yml
          rm -f .github/patches/fix_missing_far_return.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py .github
          git commit -m "Infer missed return from court-side recross"
          git push origin HEAD:revert_1
