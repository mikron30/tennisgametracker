name: Inspect V27 recovered motion

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate
    paths:
      - .github/workflows/inspect-v27-recovered-motion.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0
      - name: Extract recovered-motion context
        shell: python
        run: |
          from pathlib import Path
          p=Path('interactive_ball_analyzer.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=['def _update_recovered_motion', 'def _detect_out_of_court_bounce']
          out=['# V27 recovered-motion context','']
          for needle in needles:
              hits=[i for i,l in enumerate(lines) if needle in l]
              if not hits: raise SystemExit(f'missing {needle}')
              i=hits[0]
              lo=max(0,i-25); hi=min(len(lines),i+120)
              out += [f'## {needle} line {i+1}','```python']
              out += [f'{j+1:06d}: {lines[j]}' for j in range(lo,hi)]
              out += ['```','']
          Path('V27_RECOVERED_MOTION_CONTEXT.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
      - name: Commit context
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V27_RECOVERED_MOTION_CONTEXT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V27 recovered motion context"
          git push origin HEAD:codex/shallow-serve-turn-candidate
