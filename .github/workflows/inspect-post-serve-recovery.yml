name: Apply post-serve recovery v2

on:
  push:
    branches:
      - revert_1
    paths:
      - .github/workflows/inspect-post-serve-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch post-serve guard and Local AI recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          analyzer_path = Path('interactive_ball_analyzer.py')
          recovery_path = Path('ball_local_ai_recovery.py')
          analyzer = analyzer_path.read_text(encoding='utf-8')
          recovery = recovery_path.read_text(encoding='utf-8')

          # 1) The v1 threshold was driven by contact-spike velocity history.
          # At f5570 its floor became ~429 px, so a 277 px full reversal escaped.
          old_floor = '            _ps_jump_floor = max(100.0, _ps_recent_speed * 1.55)\n'
          new_floor = '''            # POST_SERVE_LAUNCH_LOCK_THRESHOLD_V2\n            # Contact frames can contain 300-400 px spikes.  Never let those\n            # spikes raise the reversal threshold above a clearly impossible\n            # wrong-way post-serve jump.\n            _ps_jump_floor = max(100.0, min(220.0, _ps_recent_speed * 1.10))\n'''
          if '# POST_SERVE_LAUNCH_LOCK_THRESHOLD_V2' not in analyzer:
              if old_floor not in analyzer:
                  raise RuntimeError('Could not find v1 post-serve jump floor')
              analyzer = analyzer.replace(old_floor, new_floor, 1)

          # 2) In this narrow verified post-serve failure mode, broad recovery must
          # never finish on a player silhouette.  Make that an opt-in behavior so
          # ordinary racket/player occlusion recovery remains unchanged.
          old_import = 'from ball_ai_recovery_probe import collect_candidates\n'
          new_import = 'from ball_ai_recovery_probe import DEFAULT_MODES, collect_candidates\n'
          if new_import not in recovery:
              if old_import not in recovery:
                  raise RuntimeError('Could not find recovery probe import')
              recovery = recovery.replace(old_import, new_import, 1)

          old_sig = '''        *,\n        max_anchor_distance: float = 900.0,\n    ) -> Optional[dict]:\n'''
          new_sig = '''        *,\n        max_anchor_distance: float = 900.0,\n        reject_player_zones: bool = False,\n    ) -> Optional[dict]:\n'''
          if 'reject_player_zones: bool = False' not in recovery:
              if old_sig not in recovery:
                  raise RuntimeError('Could not find _best_candidate signature')
              recovery = recovery.replace(old_sig, new_sig, 1)

          old_zone = '''            zone = player_zone(point)\n            # A candidate inside a player silhouette needs almost conclusive\n'''
          new_zone = '''            zone = player_zone(point)\n            # POST_SERVE_PLAYER_EXCLUSION_V2\n            # After a verified serve launch has already left the racket, a\n            # recovery caused by a strong wrong-way reversal may not terminate\n            # on torso/head/shoes/racket pixels, regardless of classifier score.\n            if reject_player_zones and zone is not None:\n                continue\n            # A candidate inside a player silhouette needs almost conclusive\n'''
          if '# POST_SERVE_PLAYER_EXCLUSION_V2' not in recovery:
              if old_zone not in recovery:
                  raise RuntimeError('Could not find _best_candidate player-zone block')
              recovery = recovery.replace(old_zone, new_zone, 1)

          # 3) The manually verified ball at f5589 was H=107 S=28 V=166, outside
          # every normal recovery mode.  Add a narrow emergency HSV mode only for
          # this post-serve reversal reason; it is not enabled during normal play.
          old_samples = '''        samples = list(buffered_frames)[-self.lookback_frames :]\n        if len(samples) < 2:\n            return None\n\n        corridor_anchors, corridor_cap, corridor_info = self._build_recovery_corridor(samples)\n'''
          new_samples = '''        samples = list(buffered_frames)[-self.lookback_frames :]\n        if len(samples) < 2:\n            return None\n\n        # POST_SERVE_LOW_SAT_RECOVERY_V2\n        post_serve_emergency = str(reason or "").startswith("post-serve-launch-wrong-way")\n        candidate_config = self._config\n        recovery_modes = DEFAULT_MODES\n        if post_serve_emergency:\n            candidate_config = dict(self._config)\n            candidate_config["post_serve_low_sat"] = {\n                "h_min": 80, "h_max": 135,\n                "s_min": 10, "s_max": 50,\n                "v_min": 120, "v_max": 230,\n            }\n            recovery_modes = DEFAULT_MODES + ("post_serve_low_sat",)\n\n        corridor_anchors, corridor_cap, corridor_info = self._build_recovery_corridor(samples)\n'''
          if '# POST_SERVE_LOW_SAT_RECOVERY_V2' not in recovery:
              if old_samples not in recovery:
                  raise RuntimeError('Could not find recover sample block')
              recovery = recovery.replace(old_samples, new_samples, 1)

          old_collect = '''            candidates = collect_candidates(\n                image,\n                self._config,\n                min_area=3.0,\n                max_area=2000.0,\n                around=search_anchor,\n                radius=search_radius if search_anchor is not None else None,\n            )\n'''
          new_collect = '''            candidates = collect_candidates(\n                image,\n                candidate_config,\n                modes=recovery_modes,\n                min_area=3.0,\n                max_area=2000.0,\n                around=search_anchor,\n                radius=search_radius if search_anchor is not None else None,\n            )\n'''
          if 'modes=recovery_modes' not in recovery:
              if old_collect not in recovery:
                  raise RuntimeError('Could not find collect_candidates recovery call')
              recovery = recovery.replace(old_collect, new_collect, 1)

          old_best = '''            selected = self._best_candidate(\n                scored,\n                sample_anchor,\n                player_zone,\n                max_anchor_distance=max_anchor_distance,\n            )\n'''
          new_best = '''            selected = self._best_candidate(\n                scored,\n                sample_anchor,\n                player_zone,\n                max_anchor_distance=max_anchor_distance,\n                reject_player_zones=post_serve_emergency,\n            )\n'''
          if 'reject_player_zones=post_serve_emergency' not in recovery:
              if old_best not in recovery:
                  raise RuntimeError('Could not find _best_candidate recover call')
              recovery = recovery.replace(old_best, new_best, 1)

          old_retry = '        elif str(reason).startswith("player-region:"):\n'
          new_retry = '''        elif (\n                str(reason).startswith("player-region:") or\n                str(reason).startswith("post-serve-launch-wrong-way")\n        ):\n'''
          if 'str(reason).startswith("post-serve-launch-wrong-way")\n        ):' not in recovery:
              if old_retry not in recovery:
                  raise RuntimeError('Could not find urgent retry condition')
              recovery = recovery.replace(old_retry, new_retry, 1)

          analyzer_path.write_text(analyzer, encoding='utf-8')
          recovery_path.write_text(recovery, encoding='utf-8')

          py_compile.compile(str(analyzer_path), doraise=True)
          py_compile.compile(str(recovery_path), doraise=True)
          py_compile.compile('ball_ai_recovery_probe.py', doraise=True)

          # Regression math from the supplied f5570 log.
          recent_speed = 276.9
          floor = max(100.0, min(220.0, recent_speed * 1.10))
          jump = (77.0 ** 2 + 266.0 ** 2) ** 0.5
          assert floor == 220.0 and jump > floor

          # Verify the manually observed HSV is covered only by the emergency mode.
          emergency = {"h_min": 80, "h_max": 135, "s_min": 10, "s_max": 50, "v_min": 120, "v_max": 230}
          h, s, v = 107, 28, 166
          assert emergency['h_min'] <= h <= emergency['h_max']
          assert emergency['s_min'] <= s <= emergency['s_max']
          assert emergency['v_min'] <= v <= emergency['v_max']

          print('Post-serve recovery v2 patch applied; py_compile and regression assertions passed.')
          PY

      - name: Commit patched tracker
        shell: bash
        run: |
          if git diff --quiet -- interactive_ball_analyzer.py ball_local_ai_recovery.py; then
            echo "No tracker changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py ball_local_ai_recovery.py
          git commit -m "Strengthen post-serve Local AI recovery"
          git push origin HEAD:revert_1
