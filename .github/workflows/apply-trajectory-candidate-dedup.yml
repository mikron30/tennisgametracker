name: Apply trajectory candidate dedup

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless

      - name: Patch source
        run: python tools/_tmp_patch_trajectory_candidate_dedup.py

      - name: Validate syntax
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py tests/test_ball_local_ai_recovery.py
          git diff --check

      - name: Run Local AI tests
        run: python -m unittest tests.test_ball_local_ai_recovery

      - name: Verify fine dedup is trajectory-only
        run: |
          python - <<'PY'
          from pathlib import Path
          probe = Path('ball_ai_recovery_probe.py').read_text(encoding='utf-8')
          recovery = Path('ball_local_ai_recovery.py').read_text(encoding='utf-8')
          assert 'dedup_distance: float = 12.0' in probe
          assert 'dedup_distance=4.0' in recovery
          print('verified default dedup=12px; trajectory dedup=4px')
          PY

      - name: Commit source and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch tools/_tmp_patch_trajectory_candidate_dedup.py .github/workflows/apply-trajectory-candidate-dedup.yml
          git add interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py
          git diff --cached --check
          git commit -m "Preserve close HSV candidates for trajectory AI"
          git push origin HEAD:revert_1
