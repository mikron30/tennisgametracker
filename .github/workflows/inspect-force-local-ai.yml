name: Apply forced Local AI range test

on:
  push:
    branches:
      - revert_1
    paths:
      - .github/workflows/inspect-force-local-ai.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1

      - name: Apply patch and validate
        run: |
          python .github/scripts/apply_force_local_ai_patch.py
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py
          grep -q -- '--force-local-ai-range' interactive_ball_analyzer.py
          grep -q -- '\[FORCE_LOCAL_AI\]' interactive_ball_analyzer.py

      - name: Commit tracker change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Add opt-in forced Local AI frame range"
          git push origin HEAD:revert_1
