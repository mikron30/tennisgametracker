name: Inspect force local AI hook

on:
  push:
    branches: [revert_1]
    paths:
      - .github/workflows/inspect-force-local-ai.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Inspect track commit block
        shell: bash
        run: |
          sed -n '24040,24170p' interactive_ball_analyzer.py
          echo '=== process call block ==='
          sed -n '24772,24825p' interactive_ball_analyzer.py
