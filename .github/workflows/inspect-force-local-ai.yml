name: Inspect force local AI hook

on:
  push:
    branches: [revert_1]
    paths:
      - .github/workflows/inspect-force-local-ai.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Inspect force integration helpers
        shell: bash
        run: |
          echo '=== motion metrics ==='
          grep -n -A120 -B5 "def log_motion_metrics" interactive_ball_analyzer.py | head -140 || true
          echo '=== snapshot/restore ==='
          grep -n -A100 -B8 "def _snapshot_tracking_state_for_provisional_guard" interactive_ball_analyzer.py | head -130 || true
          grep -n -A100 -B8 "def _restore_tracking_state_for_provisional_guard" interactive_ball_analyzer.py | head -130 || true
          echo '=== tracking output/update near end track_ball ==='
          grep -n "Ball tracked at" interactive_ball_analyzer.py | tail -10 || true
