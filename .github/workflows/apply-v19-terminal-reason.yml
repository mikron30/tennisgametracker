name: Apply V19 terminal reason repair

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate
    paths:
      - .github/workflows/apply-v19-terminal-reason.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0

      - name: Apply V19 patch
        run: python tools/apply_v19_terminal_reason_repair.py

      - name: Validate patched tracker
        shell: bash
        run: |
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          git diff -- interactive_ball_analyzer.py

      - name: Commit patched tracker
        shell: bash
        run: |
          if git diff --quiet -- interactive_ball_analyzer.py; then
            echo "No tracker changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Apply V19 terminal reason repair"
          git push origin HEAD:codex/shallow-serve-turn-candidate
