name: Final generic frame scan

on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/final-generic-frame-scan.yml]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Compile and scan production Python
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py
          python - <<'PY'
          from pathlib import Path
          import re
          exclude_parts={'.git','.github','tests','test','tmp','.tools','venv','.venv','__pycache__'}
          patterns=[
            re.compile(r'(?:self\.)?(?:frame_count|tracking_start_frame|serve_start_frame|point_start_frame_internal)\s*(?:==|!=|<=|>=|<|>)\s*\d{3,}'),
            re.compile(r'\bf\d{3,}\b',re.I),
            re.compile(r'\bframe \d{3,}\b',re.I),
          ]
          forbidden_terms=[
            'disable_specific_frame_logic','--disable-specific-frame-logic',
            'REFERENCE_POINT_END','Reviewed endpoint hold','Reviewed continuation hold',
            '_reference_point_end_targets','_reference_point_end_override',
            '_point_timeout_result_override','_is_reviewed_false_serve_start',
            '_court2_false_serve_start_override','_seed_match_state_from_start_frame',
            '_sync_court2_video_phase_from_frame',
          ]
          hits=[]
          for p in Path('.').rglob('*.py'):
            if any(part in exclude_parts for part in p.parts):
              continue
            text=p.read_text(encoding='utf-8',errors='replace')
            for term in forbidden_terms:
              if term in text:
                hits.append(f'{p}: forbidden term {term}')
            for rg in patterns:
              for m in rg.finditer(text):
                line=text.count('\n',0,m.start())+1
                hits.append(f'{p}:{line}: {m.group(0)}')
          if hits:
            print('VIDEO-SPECIFIC FRAME HITS:')
            print('\n'.join(hits[:200]))
            raise SystemExit(2)
          print('FINAL_GENERIC_FRAME_SCAN_OK')
          PY
          # rerun after removing the last source-video curation helper
