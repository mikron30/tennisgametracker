name: Fix physical OUT bounce reversal
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_out_bounce.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Patch OUT bounce detector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')

          old_soft = """        outward_motion = (
            (side == 'left' and curr_dx <= -4.0) or
            (side == 'right' and curr_dx >= 4.0)
        )
        soft_out_reversal = (
            (
                (
                    curr_pos_outside and
                    outside_depth >= max(20.0, sideline_margin * 1.5)
                ) or
                soft_out_near_sideline
            ) and
            soft_turn_motion and
            outward_motion and
            curr_speed >= 18.0
        )
"""
          new_soft = """        outward_motion = (
            (side == 'left' and curr_dx <= -4.0) or
            (side == 'right' and curr_dx >= 4.0)
        )
        previous_outward_motion = (
            (side == 'left' and prev_dx <= -4.0) or
            (side == 'right' and prev_dx >= 4.0)
        )
        # A real sideline OUT can bounce with only a shallow upward Y reversal.
        # Do not require the old -12px vertical rebound when the ball was already
        # clearly outside, descending for several frames, and continues outward.
        # This covers the reviewed f2486->f2487 path: (-23,+26) -> (-36,-6).
        max_physical_out_bounce_step = max(125.0, float(frame.shape[1]) * 0.035)
        shallow_outward_rebound = (
            prev_pos_outside and
            curr_pos_outside and
            recent_descending and
            previous_outward_motion and
            outward_motion and
            prev_dy >= 14.0 and
            -12.0 < curr_dy <= -3.0 and
            prev_speed >= 18.0 and
            18.0 <= curr_speed <= max_physical_out_bounce_step
        )
        soft_out_reversal = (
            (
                (
                    curr_pos_outside and
                    outside_depth >= max(20.0, sideline_margin * 1.5)
                ) or
                soft_out_near_sideline
            ) and
            (soft_turn_motion or shallow_outward_rebound) and
            outward_motion and
            curr_speed >= 18.0
        )
"""
          if text.count(old_soft) != 1:
              raise SystemExit(f'outward/soft block expected once, found {text.count(old_soft)}')
          text = text.replace(old_soft, new_soft, 1)

          old_turn = """        vertical_reversal = prev_dy >= 18.0 and curr_dy <= -12.0
        sharp_turn = angle_diff >= 95.0
        if not (vertical_reversal or sharp_turn or soft_out_reversal):
            return False, None
"""
          new_turn = """        # A very large inward X reversal while already outside is a
        # reacquisition/artifact jump, not a ground bounce.  The reviewed f2493
        # jump reverses left->right by ~179px and must not terminate the point.
        inward_horizontal_reversal = (
            (side == 'left' and prev_dx <= -8.0 and curr_dx >= 8.0) or
            (side == 'right' and prev_dx >= 8.0 and curr_dx <= -8.0)
        )
        if (
            prev_pos_outside and
            inward_horizontal_reversal and
            curr_speed > max_physical_out_bounce_step
        ):
            self._last_out_bounce_suppressed_frame = self.frame_count
            self._last_out_bounce_suppressed_point = tuple(ball_position)
            print(
                f\"Frame {self.frame_count}: [OUT-BOUNCE SUPPRESSED] \"
                f\"implausible inward jump pos={ball_position} side={side} \"
                f\"prev_motion=({prev_dx:.1f},{prev_dy:.1f}) \"
                f\"curr_motion=({curr_dx:.1f},{curr_dy:.1f}) \"
                f\"speed={curr_speed:.1f} limit={max_physical_out_bounce_step:.1f}\"
            )
            return False, None

        vertical_reversal = prev_dy >= 18.0 and curr_dy <= -12.0
        sharp_turn = angle_diff >= 95.0
        if not (vertical_reversal or sharp_turn or soft_out_reversal):
            return False, None
"""
          if text.count(old_turn) != 1:
              raise SystemExit(f'vertical/sharp block expected once, found {text.count(old_turn)}')
          text = text.replace(old_turn, new_turn, 1)

          path.write_text(text, encoding='utf-8')
          print('OUT bounce patch applied')
          PY
      - name: Validate
        run: |
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          assert 'shallow_outward_rebound = (' in text
          assert 'implausible inward jump' in text

          # Reviewed motion examples from the supplied log.
          def shallow(side, prev_dx, prev_dy, prev_speed, curr_dx, curr_dy, curr_speed, width=3840):
              previous_outward = (side == 'left' and prev_dx <= -4.0) or (side == 'right' and prev_dx >= 4.0)
              outward = (side == 'left' and curr_dx <= -4.0) or (side == 'right' and curr_dx >= 4.0)
              cap = max(125.0, width * 0.035)
              return previous_outward and outward and prev_dy >= 14.0 and -12.0 < curr_dy <= -3.0 and prev_speed >= 18.0 and 18.0 <= curr_speed <= cap

          assert shallow('left', -23, 26, 34.7, -36, -6, 36.5), 'f2487 should be a shallow outward bounce'
          assert not shallow('left', -16, 59, 61.1, 176, -34, 179.2), 'f2493 must not be a shallow outward bounce'
          cap = max(125.0, 3840 * 0.035)
          assert 179.2 > cap and (-16 <= -8 and 176 >= 8), 'f2493 should hit inward-jump suppression'
          print('Syntax, diff and reviewed-motion validation passed')
          PY
          git diff -- interactive_ball_analyzer.py
      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Recognize shallow physical OUT bounce"
          git push origin HEAD:revert_1
