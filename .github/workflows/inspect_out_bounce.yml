name: Fix physical OUT bounce reversal
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_out_bounce.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Patch OUT bounce detector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')
          old_soft = (
              "        outward_motion = (\n"
              "            (side == 'left' and curr_dx <= -4.0) or\n"
              "            (side == 'right' and curr_dx >= 4.0)\n"
              "        )\n"
              "        soft_out_reversal = (\n"
              "            (\n"
              "                (\n"
              "                    curr_pos_outside and\n"
              "                    outside_depth >= max(20.0, sideline_margin * 1.5)\n"
              "                ) or\n"
              "                soft_out_near_sideline\n"
              "            ) and\n"
              "            soft_turn_motion and\n"
              "            outward_motion and\n"
              "            curr_speed >= 18.0\n"
              "        )\n"
          )
          new_soft = (
              "        outward_motion = (\n"
              "            (side == 'left' and curr_dx <= -4.0) or\n"
              "            (side == 'right' and curr_dx >= 4.0)\n"
              "        )\n"
              "        previous_outward_motion = (\n"
              "            (side == 'left' and prev_dx <= -4.0) or\n"
              "            (side == 'right' and prev_dx >= 4.0)\n"
              "        )\n"
              "        # A real sideline OUT can bounce with only a shallow upward Y reversal.\n"
              "        # Do not require the old -12px vertical rebound when the ball was already\n"
              "        # clearly outside, descending for several frames, and continues outward.\n"
              "        # Reviewed f2486->f2487: (-23,+26) -> (-36,-6).\n"
              "        max_physical_out_bounce_step = max(125.0, float(frame.shape[1]) * 0.035)\n"
              "        shallow_outward_rebound = (\n"
              "            prev_pos_outside and\n"
              "            curr_pos_outside and\n"
              "            recent_descending and\n"
              "            previous_outward_motion and\n"
              "            outward_motion and\n"
              "            prev_dy >= 14.0 and\n"
              "            -12.0 < curr_dy <= -3.0 and\n"
              "            prev_speed >= 18.0 and\n"
              "            18.0 <= curr_speed <= max_physical_out_bounce_step\n"
              "        )\n"
              "        soft_out_reversal = (\n"
              "            (\n"
              "                (\n"
              "                    curr_pos_outside and\n"
              "                    outside_depth >= max(20.0, sideline_margin * 1.5)\n"
              "                ) or\n"
              "                soft_out_near_sideline\n"
              "            ) and\n"
              "            (soft_turn_motion or shallow_outward_rebound) and\n"
              "            outward_motion and\n"
              "            curr_speed >= 18.0\n"
              "        )\n"
          )
          if text.count(old_soft) != 1:
              raise SystemExit(f'outward/soft block expected once, found {text.count(old_soft)}')
          text = text.replace(old_soft, new_soft, 1)
          old_turn = (
              "        vertical_reversal = prev_dy >= 18.0 and curr_dy <= -12.0\n"
              "        sharp_turn = angle_diff >= 95.0\n"
              "        if not (vertical_reversal or sharp_turn or soft_out_reversal):\n"
              "            return False, None\n"
          )
          new_turn = (
              "        # A very large inward X reversal while already outside is a\n"
              "        # reacquisition/artifact jump, not a ground bounce.\n"
              "        inward_horizontal_reversal = (\n"
              "            (side == 'left' and prev_dx <= -8.0 and curr_dx >= 8.0) or\n"
              "            (side == 'right' and prev_dx >= 8.0 and curr_dx <= -8.0)\n"
              "        )\n"
              "        if (\n"
              "            prev_pos_outside and\n"
              "            inward_horizontal_reversal and\n"
              "            curr_speed > max_physical_out_bounce_step\n"
              "        ):\n"
              "            self._last_out_bounce_suppressed_frame = self.frame_count\n"
              "            self._last_out_bounce_suppressed_point = tuple(ball_position)\n"
              "            print(\n"
              "                f\"Frame {self.frame_count}: [OUT-BOUNCE SUPPRESSED] \"\n"
              "                f\"implausible inward jump pos={ball_position} side={side} \"\n"
              "                f\"prev_motion=({prev_dx:.1f},{prev_dy:.1f}) \"\n"
              "                f\"curr_motion=({curr_dx:.1f},{curr_dy:.1f}) \"\n"
              "                f\"speed={curr_speed:.1f} limit={max_physical_out_bounce_step:.1f}\"\n"
              "            )\n"
              "            return False, None\n"
              "\n"
              "        vertical_reversal = prev_dy >= 18.0 and curr_dy <= -12.0\n"
              "        sharp_turn = angle_diff >= 95.0\n"
              "        if not (vertical_reversal or sharp_turn or soft_out_reversal):\n"
              "            return False, None\n"
          )
          if text.count(old_turn) != 1:
              raise SystemExit(f'vertical/sharp block expected once, found {text.count(old_turn)}')
          text = text.replace(old_turn, new_turn, 1)
          path.write_text(text, encoding='utf-8')
          print('OUT bounce patch applied')
          PY
      - name: Validate
        run: |
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          assert 'shallow_outward_rebound = (' in text
          assert 'implausible inward jump' in text
          def shallow(side, prev_dx, prev_dy, prev_speed, curr_dx, curr_dy, curr_speed, width=3840):
              previous_outward = (side == 'left' and prev_dx <= -4.0) or (side == 'right' and prev_dx >= 4.0)
              outward = (side == 'left' and curr_dx <= -4.0) or (side == 'right' and curr_dx >= 4.0)
              cap = max(125.0, width * 0.035)
              return previous_outward and outward and prev_dy >= 14.0 and -12.0 < curr_dy <= -3.0 and prev_speed >= 18.0 and 18.0 <= curr_speed <= cap
          assert shallow('left', -23, 26, 34.7, -36, -6, 36.5)
          assert not shallow('left', -16, 59, 61.1, 176, -34, 179.2)
          cap = max(125.0, 3840 * 0.035)
          assert 179.2 > cap and (-16 <= -8 and 176 >= 8)
          print('Syntax, diff and reviewed-motion validation passed')
          PY
          git diff -- interactive_ball_analyzer.py
      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Recognize shallow physical OUT bounce"
          git push origin HEAD:revert_1
