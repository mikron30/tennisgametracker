name: Inspect player reacq

on:
  push:
    branches:
      - revert_1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Show player reacquisition rejection path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          for n in range(17488 - 1, min(len(text), 17640)):
              print(f'{n+1:05d}: {text[n]}')
          PY
