name: Patch serve post-contact stall

on:
  push:
    branches:
      - revert_1
    paths:
      - '.github/scripts/patch_serve_post_contact_stall.py'
      - '.github/workflows/patch-serve-post-contact-stall.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Apply patch
        run: python .github/scripts/patch_serve_post_contact_stall.py
      - name: Validate syntax and diff
        run: |
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          grep -n "weak_static_motion" interactive_ball_analyzer.py
          grep -n "preserving stuck=.*for recovery" interactive_ball_analyzer.py
      - name: Commit trial version and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/patch_serve_post_contact_stall.py
          rm -f .github/workflows/patch-serve-post-contact-stall.yml
          git add -A
          git commit -m "Reject static post-serve recovery candidates"
          git push origin HEAD:revert_1
