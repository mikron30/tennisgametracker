name: Fast hardcoded frame scan

on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/scan-hardcoded-frames-fast.yml]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Grep absolute frame logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          pats=[
            r'disable_specific_frame_logic', r'REFERENCE_POINT_END', r'reviewed endpoint', r'exact-frame',
            r'_reference_point_end', r'_sync_court2_video_phase_from_frame', r'specific frame',
            r'(?:frame_count|tracking_start_frame|serve_start_frame|point_start_frame_internal)\s*(?:==|!=|<=|>=|<|>)\s*\d{3,}',
            r'\d{3,}\s*(?:==|!=|<=|>=|<|>)\s*(?:self\.)?(?:frame_count|tracking_start_frame|serve_start_frame|point_start_frame_internal)',
          ]
          hits=[]
          seen=set()
          for pat in pats:
            rg=re.compile(pat,re.I)
            for i,l in enumerate(lines,1):
              if rg.search(l):
                for j in range(max(1,i-4),min(len(lines),i+6)+1):
                  seen.add(j)
          for j in sorted(seen): hits.append(f'{j:06d}: {lines[j-1]}')
          Path('.github/hardcoded_frame_scan_fast.txt').write_text('\n'.join(hits)+'\n',encoding='utf-8')
          PY
      - name: Commit scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/hardcoded_frame_scan_fast.txt
          git commit -m "Record fast hardcoded frame scan"
          git push origin HEAD:revert_1
