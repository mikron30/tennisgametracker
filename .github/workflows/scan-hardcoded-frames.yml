name: Scan hardcoded frame-specific logic

on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/scan-hardcoded-frames.yml]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Scan analyzer for absolute frame logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re
          p=Path('interactive_ball_analyzer.py')
          src=p.read_text(encoding='utf-8')
          lines=src.splitlines()
          out=[]
          pats=[
            r'disable_specific_frame_logic', r'specific.frame', r'REFERENCE_POINT_END',
            r'reviewed endpoint', r'exact.frame', r'_reference_point_end', r'_sync_court2_video_phase_from_frame',
            r'frame_count\s*(?:==|!=|<=|>=|<|>)\s*\d{3,}', r'\d{3,}\s*(?:==|!=|<=|>=|<|>)\s*self\.frame_count',
            r'start_frame\s*(?:==|!=|<=|>=|<|>)\s*\d{3,}', r'tracking_start_frame\s*(?:==|!=|<=|>=|<|>)\s*\d{3,}',
            r'serve_start_frame\s*(?:==|!=|<=|>=|<|>)\s*\d{3,}', r'frame\s+\d{4,}',
          ]
          for pat in pats:
            out.append('\n### PATTERN '+pat)
            rg=re.compile(pat,re.I)
            for i,l in enumerate(lines,1):
              if rg.search(l):
                a=max(1,i-5); b=min(len(lines),i+8)
                out.append(f'-- lines {a}-{b} --')
                out.extend(f'{j:06d}: {lines[j-1]}' for j in range(a,b+1))
          # AST: comparisons involving frame-ish identifiers and integer constants >= 100
          try:
            tree=ast.parse(src)
            for n in ast.walk(tree):
              if isinstance(n, ast.Compare):
                txt=ast.get_source_segment(src,n) or ''
                if re.search(r'frame|start_frame|end_frame',txt,re.I):
                  nums=[x.value for x in ast.walk(n) if isinstance(x,ast.Constant) and isinstance(x.value,int)]
                  if any(abs(v)>=100 for v in nums):
                    i=n.lineno; a=max(1,i-4); b=min(len(lines),getattr(n,'end_lineno',i)+5)
                    out.append(f'\n### AST FRAME COMPARE line {i}: {txt}')
                    out.extend(f'{j:06d}: {lines[j-1]}' for j in range(a,b+1))
          except Exception as e:
            out.append('AST ERROR '+repr(e))
          Path('.github/hardcoded_frame_scan.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit scan output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/hardcoded_frame_scan.txt
          git commit -m "Record hardcoded frame scan"
          git push origin HEAD:revert_1
