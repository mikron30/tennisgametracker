name: Apply post-serve launch lock

on:
  push:
    branches:
      - revert_1
    paths:
      - .github/workflows/apply-post-serve-launch-lock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revert_1
        uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch current analyzer safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import math

          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')

          ARM_MARKER = '# POST_SERVE_LAUNCH_LOCK_ARM_V1'
          GUARD_MARKER = '# POST_SERVE_LAUNCH_LOCK_GUARD_V1'

          if ARM_MARKER in text or GUARD_MARKER in text:
              if ARM_MARKER in text and GUARD_MARKER in text:
                  print('Post-serve launch lock already installed; nothing to do.')
                  raise SystemExit(0)
              raise RuntimeError('Partial post-serve lock installation detected; refusing to modify file.')

          # 1) Arm a short lock immediately after a verified serve-contact launch.
          launch_idx = text.find('[SERVE-CONTACT LAUNCH]')
          if launch_idx < 0:
              raise RuntimeError('Could not find SERVE-CONTACT LAUNCH anchor')
          return_idx = text.find('        return chosen\n', launch_idx)
          if return_idx < 0:
              raise RuntimeError('Could not find return chosen after serve-contact launch')

          arm = '''        # POST_SERVE_LAUNCH_LOCK_ARM_V1\n        # For the next few frames, a large vertical jump back toward the server\n        # is treated as a player-body latch and handed to Local AI recovery.\n        self._post_serve_launch_lock_until_frame = max(\n            int(getattr(self, "_post_serve_launch_lock_until_frame", -1)),\n            int(self.frame_count) + 7,\n        )\n        self._post_serve_launch_lock_last_reject_frame = -1000000\n        print(\n            f"[POST_SERVE_LAUNCH_LOCK] f{self.frame_count}: armed through "\n            f"f{self._post_serve_launch_lock_until_frame} direction={self.serve_direction_label()}"\n        )\n'''
          text = text[:return_idx] + arm + text[return_idx:]

          # 2) Before the normal Local-AI recovery reason logic, recognize the\n          # specific post-serve failure: tracker jumps strongly back to the server.\n          reason_anchor = '''    def _local_ai_recovery_reason(self, previous_position, tracked_position, previous_stuck):\n        """Return a narrow recovery trigger; normal tracking remains primary."""\n        if self.local_ai_recovery is None:\n            return None\n'''
          if reason_anchor not in text:
              raise RuntimeError('Could not find _local_ai_recovery_reason anchor')

          guard = '''    def _local_ai_recovery_reason(self, previous_position, tracked_position, previous_stuck):\n        """Return a narrow recovery trigger; normal tracking remains primary."""\n        if self.local_ai_recovery is None:\n            return None\n\n        # POST_SERVE_LAUNCH_LOCK_GUARD_V1\n        # Once a serve launch was verified, do not let a large wrong-way jump\n        # immediately re-anchor tracking on the server/player body.  We do not\n        # reject small vertical noise; only a strong reversal inside a short\n        # post-contact window is escalated to the existing Local-AI recovery.\n        _post_serve_lock_until = int(\n            getattr(self, "_post_serve_launch_lock_until_frame", -1)\n        )\n        if (\n                int(self.frame_count) <= _post_serve_lock_until and\n                previous_position is not None and\n                tracked_position is not None\n        ):\n            _ps_dx = float(tracked_position[0] - previous_position[0])\n            _ps_dy = float(tracked_position[1] - previous_position[1])\n            _ps_distance = math.hypot(_ps_dx, _ps_dy)\n            _ps_expected_dy = int(getattr(self, "serve_direction_dy", 0) or 0)\n\n            _ps_recent_speed = 0.0\n            _ps_velocity_history = getattr(self, "ball_velocity_history", None) or []\n            if _ps_velocity_history:\n                try:\n                    _ps_recent_speed = float(np.median(_ps_velocity_history[-5:]))\n                except Exception:\n                    _ps_recent_speed = 0.0\n\n            _ps_jump_floor = max(100.0, _ps_recent_speed * 1.55)\n            _ps_wrong_way = (\n                (_ps_expected_dy < 0 and _ps_dy >= 70.0) or\n                (_ps_expected_dy > 0 and _ps_dy <= -70.0)\n            )\n\n            if _ps_wrong_way and _ps_distance >= _ps_jump_floor:\n                self._post_serve_launch_lock_last_reject_frame = int(self.frame_count)\n                print(\n                    f"[POST_SERVE_LAUNCH_REJECT] f{self.frame_count}: "\n                    f"tracked={tracked_position} previous={previous_position} "\n                    f"dy={_ps_dy:+.0f}px dist={_ps_distance:.1f}px "\n                    f"floor={_ps_jump_floor:.1f}px; forcing Local AI recovery"\n                )\n                return "post-serve-launch-wrong-way"\n'''
          text = text.replace(reason_anchor, guard, 1)

          path.write_text(text, encoding='utf-8')
          py_compile.compile(str(path), doraise=True)
          print('interactive_ball_analyzer.py patched and py_compile passed')
          PY

      - name: Commit patched analyzer
        shell: bash
        run: |
          if git diff --quiet -- interactive_ball_analyzer.py; then
            echo "No analyzer changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Prevent post-serve tracker latch onto server"
          git push origin HEAD:revert_1
