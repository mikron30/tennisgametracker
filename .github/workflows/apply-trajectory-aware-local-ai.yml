name: Apply trajectory-aware Local AI

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch source
        run: python tools/_tmp_patch_trajectory_ai.py

      - name: Validate syntax
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py tests/test_ball_local_ai_recovery.py
          git diff --check

      - name: Run Local AI tests
        run: python -m unittest tests.test_ball_local_ai_recovery

      - name: Commit source and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch tools/_tmp_patch_trajectory_ai.py .github/workflows/apply-trajectory-aware-local-ai.yml
          git add interactive_ball_analyzer.py ball_local_ai_recovery.py tests/test_ball_local_ai_recovery.py
          git diff --cached --check
          git commit -m "Use trajectory evidence in Local AI player recovery"
          git push origin HEAD:revert_1
