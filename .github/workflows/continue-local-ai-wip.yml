name: Continue local AI WIP

on:
  push:
    branches: [codex-ai-recovery-wip]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-ai-recovery-wip
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Apply reviewed runtime guard
        run: |
          git apply --ignore-space-change --check proposals/local_ai_physics.patch
          git apply --ignore-space-change proposals/local_ai_physics.patch

      - name: Add legacy checkpoint compatibility and finish WIP docs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ball_local_ai.py')
          text = path.read_text(encoding='utf-8')
          needle = '''    return BallPatchCNN\n\n\n@dataclass(frozen=True)\nclass TrainingRow:'''
          replacement = '''    return BallPatchCNN\n\n\ndef _legacy_model_class():\n    \"\"\"Architecture used by early 48-feature local-AI checkpoints.\"\"\"\n    torch, nn, _, _, _ = _torch()\n\n    class LegacyBallPatchCNN(nn.Module):\n        def __init__(self) -> None:\n            super().__init__()\n            self.features = nn.Sequential(\n                nn.Conv2d(3, 20, 5, padding=2), nn.ReLU(), nn.MaxPool2d(2),\n                nn.Conv2d(20, 36, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),\n                nn.Conv2d(36, 48, 3, padding=1), nn.ReLU(),\n                nn.AdaptiveAvgPool2d((1, 1)),\n            )\n            self.classifier = nn.Linear(48, 1)\n\n        def forward(self, batch):\n            return self.classifier(self.features(batch).flatten(1)).squeeze(1)\n\n    return LegacyBallPatchCNN\n\n\ndef _checkpoint_architecture(checkpoint):\n    \"\"\"Identify supported patch-CNN generations from classifier shape.\"\"\"\n    state_dict = checkpoint.get('state_dict') or {}\n    weight = state_dict.get('classifier.weight')\n    shape = getattr(weight, 'shape', None)\n    if shape is None or len(shape) != 2:\n        raise RuntimeError('Unsupported local-AI checkpoint: missing classifier.weight shape')\n    in_features = int(shape[1])\n    if in_features == 48:\n        return 'legacy-global-average-pool'\n    current_features = 48 * (PATCH_SIZE // 4) * (PATCH_SIZE // 4)\n    if in_features == current_features:\n        return 'spatial-center-aware'\n    raise RuntimeError(\n        f'Unsupported local-AI checkpoint classifier width: {in_features}'\n    )\n\n\n@dataclass(frozen=True)\nclass TrainingRow:'''
          if needle not in text:
              raise SystemExit('Could not locate model-class insertion point')
          text = text.replace(needle, replacement, 1)

          old_loader = '''    model = _model_class()()\n    model.load_state_dict(checkpoint[\"state_dict\"])\n    loaded = (device, model.to(device).eval())\n    return (*loaded, checkpoint) if return_metadata else loaded'''
          new_loader = '''    architecture = _checkpoint_architecture(checkpoint)\n    model_factory = (\n        _legacy_model_class()\n        if architecture == 'legacy-global-average-pool'\n        else _model_class()\n    )\n    model = model_factory()\n    model.load_state_dict(checkpoint[\"state_dict\"])\n    checkpoint = dict(checkpoint)\n    checkpoint.setdefault('model_architecture', architecture)\n    loaded = (device, model.to(device).eval())\n    return (*loaded, checkpoint) if return_metadata else loaded'''
          if old_loader not in text:
              raise SystemExit('Could not locate _load_model body')
          text = text.replace(old_loader, new_loader, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_ball_ai_training.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'from ball_local_ai import TrainingRow, reviewed_split, train',
              'from ball_local_ai import TrainingRow, _checkpoint_architecture, reviewed_split, train',
              1,
          )
          marker = '''class ReviewedTrainingTests(unittest.TestCase):\n'''
          addition = '''class _ShapeOnlyWeight:\n    def __init__(self, width):\n        self.shape = (1, width)\n\n\nclass ReviewedTrainingTests(unittest.TestCase):\n    def test_checkpoint_architecture_supports_incumbent_and_current_models(self):\n        self.assertEqual(\n            _checkpoint_architecture({'state_dict': {'classifier.weight': _ShapeOnlyWeight(48)}}),\n            'legacy-global-average-pool',\n        )\n        self.assertEqual(\n            _checkpoint_architecture({'state_dict': {'classifier.weight': _ShapeOnlyWeight(48 * 24 * 24)}}),\n            'spatial-center-aware',\n        )\n\n'''
          if marker not in tests:
              raise SystemExit('Could not locate training test class')
          tests = tests.replace(marker, addition, 1)
          test_path.write_text(tests, encoding='utf-8')

          doc_path = Path('LOCAL_AI_REVIEW_WORKFLOW.md')
          doc = doc_path.read_text(encoding='utf-8')
          old = '''The draft runtime guard is in `proposals/local_ai_physics.patch`. It is not\nenabled in the tracker. `git apply --ignore-space-change --check` validates its\napplicability despite Windows line endings; full video regression is still\nrequired before enabling it.'''
          new = '''The runtime physical/temporal guard is implemented on the AI-recovery WIP\nbranch. It is deliberately not promoted to the production branch until the\ncomplete video regression passes. AI confidence alone is not sufficient to\nchange the trusted trajectory, and an AI miss preserves the pre-recovery track\nstate instead of committing the rejected HSV hypothesis.'''
          if old in doc:
              doc = doc.replace(old, new, 1)
          else:
              doc += '\n\n' + new + '\n'
          doc_path.write_text(doc, encoding='utf-8')
          PY

      - name: Compile and run AI/scoring regressions
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_local_ai.py ball_ai_database.py ball_ai_review.py ball_ai_log_review.py
          python -m unittest \
            tests.test_ai_physical_validation \
            tests.test_ball_ai_database \
            tests.test_ball_ai_log_review \
            tests.test_ball_ai_review \
            tests.test_ball_ai_training \
            tests.test_ball_local_ai_recovery \
            tests.test_retro_let_scoring \
            tests.test_serve_side_consistency
          python -m pytest -q tests/test_recovered_serve_scoring.py
          git diff --check

      - name: Commit validated WIP changes
        run: |
          rm -f .github/workflows/continue-local-ai-wip.yml
          rm -f proposals/local_ai_physics.patch
          git config user.name 'chatgpt-ai-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A interactive_ball_analyzer.py ball_local_ai_recovery.py ball_local_ai.py ball_ai_database.py ball_ai_review.py ball_ai_log_review.py LOCAL_AI_REVIEW_WORKFLOW.md tests/test_ai_physical_validation.py tests/test_ball_ai_database.py tests/test_ball_ai_log_review.py tests/test_ball_ai_review.py tests/test_ball_ai_training.py proposals/local_ai_physics.patch .github/workflows/continue-local-ai-wip.yml
          git commit -m 'Guard local AI trajectory and load legacy checkpoints'
          git push origin HEAD:codex-ai-recovery-wip
