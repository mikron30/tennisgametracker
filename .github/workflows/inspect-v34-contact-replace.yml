name: Inspect V34 contact replacement

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0
      - name: Record context
        run: python tools/inspect_v34_contact_replace.py
      - name: Commit context safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V34_CONTACT_REPLACE_CONTEXT.md
          if git diff --cached --quiet; then
            echo "No context changes"
            exit 0
          fi
          git commit -m "Record V34 contact replacement context"
          git pull --rebase origin codex/shallow-serve-turn-candidate
          git push origin HEAD:codex/shallow-serve-turn-candidate
