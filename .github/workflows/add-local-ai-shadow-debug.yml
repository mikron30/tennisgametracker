name: Add temporary local AI shadow debug

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch analyzer with shadow rank debug
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')
          if '[LOCAL_AI_SHADOW_RANK]' in text:
              print('shadow rank debug already present')
              raise SystemExit(0)

          # Generic range parser. No specific frame/location is hard-coded.
          marker = 'class _QuietTrackerOutput:'
          if marker not in text:
              raise RuntimeError('range parser insertion marker not found')
          helper = (
              'def _parse_frame_range(value: str) -> Tuple[int, int]:\n'
              '    raw = str(value or "").strip()\n'
              '    if ":" not in raw:\n'
              '        raise argparse.ArgumentTypeError("frame range must be START:END")\n'
              '    left, right = raw.split(":", 1)\n'
              '    try:\n'
              '        start, end = int(left), int(right)\n'
              '    except ValueError as error:\n'
              '        raise argparse.ArgumentTypeError("frame range must contain integers") from error\n'
              '    if start < 0 or end < start:\n'
              '        raise argparse.ArgumentTypeError("frame range must satisfy 0 <= START <= END")\n'
              '    return start, end\n\n\n'
          )
          text = text.replace(marker, helper + marker, 1)

          # Constructor options.
          old = '        local_ai_recovery_dir: Optional[str] = None,\n    ):'
          new = (
              '        local_ai_recovery_dir: Optional[str] = None,\n'
              '        debug_local_ai_range: Optional[Tuple[int, int]] = None,\n'
              '        debug_local_ai_radius: float = 140.0,\n'
              '    ):'
          )
          if old not in text:
              raise RuntimeError('constructor signature marker not found')
          text = text.replace(old, new, 1)

          old = '        self.local_ai_recovery = None\n        self._local_ai_frame_buffer = frame_buffer(12)'
          new = (
              '        self.local_ai_recovery = None\n'
              '        self._debug_local_ai_range = debug_local_ai_range\n'
              '        self._debug_local_ai_radius = max(20.0, float(debug_local_ai_radius))\n'
              '        self._local_ai_frame_buffer = frame_buffer(12)'
          )
          if old not in text:
              raise RuntimeError('local AI state marker not found')
          text = text.replace(old, new, 1)

          # Raw current-frame AI ranking. This does NOT call recover() and does not
          # write ball_center/stuck/cooldown or any game state.
          method_marker = '    def _try_local_ai_recovery('
          if method_marker not in text:
              raise RuntimeError('recovery method marker not found')
          method = (
              '    def _debug_local_ai_shadow_frame(self, frame, previous_position, normal_position):\n'
              '        frame_range = getattr(self, "_debug_local_ai_range", None)\n'
              '        if frame_range is None or frame is None or self.local_ai_recovery is None:\n'
              '            return\n'
              '        start_frame, end_frame = frame_range\n'
              '        if not (int(start_frame) <= int(self.frame_count) <= int(end_frame)):\n'
              '            return\n'
              '        anchors = []\n'
              '        for label, point in (("previous", previous_position), ("normal", normal_position)):\n'
              '            if point is None:\n'
              '                continue\n'
              '            point = (int(point[0]), int(point[1]))\n'
              '            if any(existing[1] == point for existing in anchors):\n'
              '                continue\n'
              '            anchors.append((label, point))\n'
              '        debug_image = frame.copy()\n'
              '        for label, anchor in anchors:\n'
              '            try:\n'
              '                ranked = self.local_ai_recovery.rank_local_roi_candidate(\n'
              '                    int(self.frame_count), frame, anchor=anchor,\n'
              '                    radius=float(self._debug_local_ai_radius), maximum_candidates=32,\n'
              '                )\n'
              '            except Exception as error:\n'
              '                print(f"[LOCAL_AI_SHADOW_RANK] f{self.frame_count} anchor={label}:{anchor} ERROR={error}")\n'
              '                continue\n'
              '            if ranked is None:\n'
              '                print(f"[LOCAL_AI_SHADOW_RANK] f{self.frame_count} anchor={label}:{anchor} no-candidate radius={self._debug_local_ai_radius:.0f}px")\n'
              '                continue\n'
              '            point = (int(ranked["x"]), int(ranked["y"]))\n'
              '            zone = self._player_point_zone(point)\n'
              '            distance = math.hypot(point[0] - anchor[0], point[1] - anchor[1])\n'
              '            score = float(ranked.get("ai_score", 0.0) or 0.0)\n'
              '            margin = ranked.get("roi_score_margin")\n'
              '            margin_text = "n/a" if margin is None else f"{float(margin):.6f}"\n'
              '            print(\n'
              '                f"[LOCAL_AI_SHADOW_RANK] f{self.frame_count} anchor={label}:{anchor} "\n'
              '                f"top={point} score={score:.6f} margin={margin_text} "\n'
              '                f"distance={distance:.1f}px zone={zone or \"clear\"} "\n'
              '                f"candidates={int(ranked.get(\"roi_candidates\", 0) or 0)}"\n'
              '            )\n'
              '            cv2.circle(debug_image, anchor, 14, (0, 255, 255), 2)\n'
              '            cv2.circle(debug_image, point, 20, (255, 0, 255), 3)\n'
              '            cv2.putText(debug_image, f"AI {score:.4f}", (point[0] + 10, point[1] + 20),\n'
              '                        cv2.FONT_HERSHEY_SIMPLEX, 0.65, (255, 0, 255), 2)\n'
              '        out_dir = self.local_ai_recovery.work_dir / "shadow_frames"\n'
              '        out_dir.mkdir(parents=True, exist_ok=True)\n'
              '        output_path = out_dir / f"shadow_f{int(self.frame_count):08d}.jpg"\n'
              '        cv2.imwrite(str(output_path), debug_image)\n'
              '        print(f"[LOCAL_AI_SHADOW_IMAGE] f{self.frame_count} saved={output_path}")\n\n'
          )
          text = text.replace(method_marker, method + method_marker, 1)

          # Run shadow rank immediately before normal recovery.
          recover_call = '                    tracked_position = self._try_local_ai_recovery('
          if recover_call not in text:
              raise RuntimeError('recovery call site not found')
          text = text.replace(
              recover_call,
              '                    self._debug_local_ai_shadow_frame(frame, prev_ball_center, tracked_position)\n' + recover_call,
              1,
          )

          # CLI flags.
          cli_marker = '    parser.add_argument("--disable-player-tracking", action="store_true",'
          if cli_marker not in text:
              raise RuntimeError('CLI insertion marker not found')
          cli = (
              '    parser.add_argument("--debug-local-ai-range", type=_parse_frame_range, metavar="START:END", default=None,\n'
              '                        help="Raw Local-AI rank debug for an inclusive frame range; does not change tracking")\n'
              '    parser.add_argument("--debug-local-ai-radius", type=float, default=140.0,\n'
              '                        help="ROI radius for --debug-local-ai-range (default 140 px)")\n'
          )
          text = text.replace(cli_marker, cli + cli_marker, 1)

          # Constructor call.
          old = '                                                   local_ai_recovery_dir=args.local_ai_recovery_dir)'
          new = (
              '                                                   local_ai_recovery_dir=args.local_ai_recovery_dir,\n'
              '                                                   debug_local_ai_range=args.debug_local_ai_range,\n'
              '                                                   debug_local_ai_radius=args.debug_local_ai_radius)'
          )
          if old not in text:
              raise RuntimeError('constructor call marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('patched raw local AI shadow rank debug')
          PY

          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py
          git diff --check

      - name: Commit source and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/add-local-ai-shadow-debug.yml
          git add interactive_ball_analyzer.py
          git diff --cached --check
          git commit -m "Add opt-in raw local AI frame ranking debug"
          git push origin HEAD:revert_1
