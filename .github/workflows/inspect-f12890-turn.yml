name: Apply f12890 vertical contact follow

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch analyzer and syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')
          marker = '[PLAYER-REACQ VERTICAL CONTACT]'
          if marker in text:
              print('vertical-contact follow already present')
              raise SystemExit(0)

          needle = "                    self._last_direction_change_vertical_reversal = bool(forward_vertical_reversal)\n"
          if needle not in text:
              raise RuntimeError('direction-change insertion point not found')

          body = '''# A real ball can emerge from a player/racket occlusion with a sharp
          # vertical reversal while still overlapping the player's mask.  The
          # generic tight-ROI trigger deliberately ignores strong normal
          # motion, so without this bridge the tracker records a direction
          # change but never arms the outgoing contact follow.  Treat this
          # narrowly-scoped case as a verified racket launch: keep the normal
          # HSV position for this frame, but seed the fast contact follow with
          # the NEW outgoing vector so the next frame searches where the ball
          # is actually going.
          player_reacq_vertical_contact = False
          if forward_vertical_reversal:
              player_reacq_active = int(
                  getattr(self, '_player_reacq_protect_until_frame', -1)
              ) >= int(self.frame_count)
              active_zones = ('player_body', 'racket_fragment', 'player_shoes')
              current_point = tuple(self.ball_center) if self.ball_center is not None else None
              near_player_turn = any(
                  point is not None and (
                      self._player_point_zone(point) in active_zones or
                      self._point_in_player_contact_corridor(point)
                  )
                  for point in (prev_pos, current_point)
              )
              player_reacq_vertical_contact = (
                  player_reacq_active and
                  near_player_turn and
                  distance >= 10.0 and
                  abs(dy) >= 4.0
              )

          if player_reacq_vertical_contact:
              contact_point = prev_pos if prev_pos is not None else self.ball_center
              if getattr(self, 'ground_bounce_count', 0) > 0:
                  self.ground_bounce_count = 0
                  self.last_ground_bounce_frame = -1000000
              if int(getattr(self, '_last_racket_contact_frame', -1000000)) != int(self.frame_count):
                  self._record_racket_contact(
                      contact_point,
                      label='player-reacq vertical reversal',
                  )
              if contact_point is not None:
                  self._add_impact_marker(
                      contact_point,
                      kind='racket_contact',
                      ttl=7,
                      label='player-reacq vertical reversal',
                  )

              velocity_history = list(getattr(self, 'ball_velocity_history', []))[-4:]
              velocity_history.append(float(distance))
              current_pos = tuple(self.ball_center)
              self._local_ai_tight_roi_follow = {
                  'start_frame': int(self.frame_count),
                  'deadline': int(self.frame_count) + 20,
                  'last_frame': int(self.frame_count),
                  'last_pos': current_pos,
                  'velocity': (float(dx), float(dy)),
                  'velocity_history': velocity_history,
                  'outside_count': 0,
                  'mode': 'fast_contact',
                  'ai_accept_count': 0,
              }
              # The accepted normal candidate is the contact-launch seed.  Do
              # not run broad buffered recovery on the same frame merely
              # because the seed is still inside the player bounding box.
              self._local_ai_tight_roi_accept_frame = int(self.frame_count)
              self._rally_contact_grace_frames = max(
                  int(getattr(self, '_rally_contact_grace_frames', 0)), 5
              )
              self._contact_recovery_frames = max(
                  int(getattr(self, '_contact_recovery_frames', 0)), 4
              )
              self.direction_change_streak = 0
              print(
                  f"Frame {self.frame_count}: [PLAYER-REACQ VERTICAL CONTACT] "
                  f"launch={current_pos} contact={contact_point} "
                  f"vector=({dx:.1f},{dy:.1f}) speed={distance:.1f}px "
                  f"follow_until=f{self.frame_count + 20}"
              )

          '''
          insert = textwrap.indent(textwrap.dedent(body), '                    ')
          text = text.replace(needle, needle + insert, 1)
          path.write_text(text, encoding='utf-8')
          print('patched vertical-contact follow')
          PY

          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py

      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/inspect-f12890-turn.yml
          git add interactive_ball_analyzer.py
          git diff --cached --check
          git commit -m "Arm tight follow on player vertical reversal"
          git push origin HEAD:revert_1
