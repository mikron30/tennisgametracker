name: Inspect serve start
on:
  push:
    branches: [revert_1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Locate serve start logic
        run: |
          grep -n -E "Early-serve bias|Serve candidate in area|serve-toss-rise|serve scan outside|waiting_serve_candidate|WAITING_FOR_SERVE|Starting ball tracking" interactive_ball_analyzer.py || true
          python - <<'PY'
          from pathlib import Path
          lines=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          needles=['Early-serve bias','Serve candidate in area','serve-toss-rise','waiting_serve_candidate']
          seen=set()
          for needle in needles:
              for i,line in enumerate(lines):
                  if needle in line:
                      a=max(0,i-90); b=min(len(lines),i+130)
                      key=(a,b)
                      if key in seen: continue
                      seen.add(key)
                      print(f'\n===== {needle} around line {i+1} =====')
                      for j in range(a,b):
                          print(f'{j+1:6d}: {lines[j]}')
          PY
