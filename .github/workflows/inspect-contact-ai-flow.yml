name: Inspect contact AI flow

on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/inspect-contact-ai-flow.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Extract full contact arbiter
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          start, end = 5635, 6040
          out = [f'{j+1:06d}: {src[j]}' for j in range(start-1, min(end, len(src)))]
          Path('.github/contact_ai_flow_context.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/contact_ai_flow_context.txt
          git commit -m "Extract full contact AI arbiter"
          git push origin HEAD:revert_1
