name: Apply V29 safe player reacquisition evidence

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0

      - name: Apply V29 patch
        run: python tools/fix_v29_player_reacq_candidate_evidence.py

      - name: Validate patched tracker
        shell: bash
        run: |
          python -m py_compile interactive_ball_analyzer.py
          python - <<'PY'
          from pathlib import Path
          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          start = text.index('# V28: a player-contact reacquisition')
          end = text.index('                    if low_sat_large_fragment:', start)
          block = text[start:end]
          assert "candidate_hsv = locals().get('hsv_values')" in block
          assert 'candidate_patch_hsv = cv2.cvtColor' in block
          assert "candidate_contour = locals().get('best_contour')" in block
          assert 'candidate_area >= 18.0' in block
          assert 'if hsv_values is not None' not in block
          assert 'size={candidate_area:.1f}px' in text
          print('V29 safe evidence guard present')
          PY
          git diff --check
          git diff -- interactive_ball_analyzer.py

      - name: Commit patched tracker
        shell: bash
        run: |
          if git diff --quiet -- interactive_ball_analyzer.py; then
            echo "No tracker changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Apply V29 safe player reacquisition candidate evidence"
          git push origin HEAD:codex/shallow-serve-turn-candidate
