name: One-shot serve rally latch fix

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_serve_rally.py
          python /tmp/patch_serve_rally.py
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          grep -q "_serve_completed_for_point = True" interactive_ball_analyzer.py
          grep -q "def _serve_bounce_out_from_turn_candidate" interactive_ball_analyzer.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-serve-rally-latch.yml
          git add interactive_ball_analyzer.py
          git commit -m "Prevent serve logic after rally begins"
          git push origin HEAD:revert_1
