name: Fix stale serve state hiding rally out

on:
  push:
    branches: [revert_1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch stale serve boundary handling
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')
          assert 'def _serve_bounce_context_live(self):' not in text

          def function_node(source, name):
              tree = ast.parse(source)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      return node
              raise RuntimeError(f'missing function {name}')

          # Central predicate: an awaiting-serve flag is only authoritative while
          # a first service landing is still physically plausible.  Once the
          # serve window expires, or rally evidence exists, boundary OUT logic
          # must treat the flight as rally state rather than hiding the point.
          node = function_node(text, '_serve_bounce_frame_limit')
          lines = text.splitlines(keepends=True)
          helper = '''\n    def _serve_bounce_context_live(self):\n        """Return True only while the pending first service bounce is still live."""\n        if not (\n            getattr(self, '_serve_phase_active', False) and\n            getattr(self, '_awaiting_serve_bounce', False)\n        ):\n            return False\n\n        start = getattr(self, 'point_start_frame_internal', None)\n        if start is None:\n            return False\n\n        context = getattr(self, '_point_history_current', None) or {}\n        if getattr(self, '_serve_landed_in_current_attempt', False):\n            return False\n        if int(getattr(self, '_point_hit_count', 0)) > 0 or context.get('shot_events'):\n            return False\n\n        last_racket = int(getattr(self, '_last_racket_contact_frame', -1000000))\n        if last_racket >= int(start):\n            return False\n\n        age = int(self.frame_count) - int(start)\n        return 0 <= age <= max(75, int(self._serve_bounce_frame_limit()))\n'''
          lines.insert(node.end_lineno, helper)
          text = ''.join(lines)

          # A stale awaiting-serve flag must not disable top/far-baseline rally OUT.
          node = function_node(text, '_top_far_baseline_fall_out_candidate')
          lines = text.splitlines(keepends=True)
          body = ''.join(lines[node.lineno-1:node.end_lineno])
          old = "        if getattr(self, '_awaiting_serve_bounce', False):\n            return False, None\n"
          assert old in body
          body = body.replace(
              old,
              "        if self._serve_bounce_context_live():\n            return False, None\n",
              1,
          )
          lines[node.lineno-1:node.end_lineno] = [body]
          text = ''.join(lines)

          # During a boundary reversal, distinguish a genuinely live service
          # landing from a stale serve flag.  Live serves keep the stricter
          # service-fault gates; stale/rally state proceeds through normal court
          # geometry and can end the point as OUT.
          node = function_node(text, '_confirmed_boundary_reversal_out_candidate')
          lines = text.splitlines(keepends=True)
          body = ''.join(lines[node.lineno-1:node.end_lineno])
          start_marker = "        serve_bounce = bool(getattr(self, '_awaiting_serve_bounce', False))\n"
          turn_marker = "            # A turn near the server can be a racket/body fragment. Require\n"
          a = body.index(start_marker)
          b = body.index(turn_marker, a)
          replacement = '''        serve_bounce = self._serve_bounce_context_live()\n        if serve_bounce:\n            start = getattr(self, 'point_start_frame_internal', None)\n            # Preserve the old minimum-age safety gate for genuine service\n            # bounces, but do not let an expired serve flag suppress rally OUT.\n            if start is None or int(self.frame_count) - int(start) < 3:\n                return False, None\n'''
          body = body[:a] + replacement + body[b:]
          lines[node.lineno-1:node.end_lineno] = [body]
          text = ''.join(lines)
          path.write_text(text, encoding='utf-8')

          # Update regression expectations: rally evidence or an expired serve
          # window should now yield to normal OUT geometry instead of suppressing it.
          test_path = Path('tests/test_recovered_serve_scoring.py')
          tests = test_path.read_text(encoding='utf-8')
          old_cases = "@pytest.mark.parametrize('case', ['no_crossing', 'stale_crossing', 'rally_contact',\n                                  'shot_event', 'serve_in', 'expired', 'large_blob',\n                                  'no_reversal', 'line_contact'])"
          new_cases = "@pytest.mark.parametrize('case', ['no_crossing', 'stale_crossing', 'large_blob',\n                                  'no_reversal', 'line_contact'])"
          assert old_cases in tests
          tests = tests.replace(old_cases, new_cases, 1)

          anchor = "\ndef test_rally_boundary_reversal_still_awards_regular_out(analyzer):\n"
          assert anchor in tests
          extra = r'''\n\n@pytest.mark.parametrize('case', ['rally_contact', 'shot_event', 'serve_in', 'expired'])\ndef test_stale_serve_state_yields_to_regular_boundary_out(analyzer, case):\n    frame = recovered_reversal(analyzer)\n    if case == 'rally_contact':\n        analyzer._last_racket_contact_frame = 730\n    elif case == 'shot_event':\n        analyzer._point_history_current['shot_events'] = [{'player': 'P2', 'frame': 730}]\n    elif case == 'serve_in':\n        analyzer._serve_landed_in_current_attempt = True\n    elif case == 'expired':\n        analyzer.point_start_frame_internal = 500\n    ended, reason = analyzer._confirmed_boundary_reversal_out_candidate(analyzer.ball_center, frame)\n    assert ended\n    assert reason == 'Ball bounce outside singles court (right sideline)'\n\n\ndef test_expired_serve_flag_does_not_hide_far_baseline_reversal(analyzer):\n    start(analyzer, 2783, (2384, 1011))\n    analyzer.frame_count = 2930\n    analyzer.ball_center = (2174, 222)\n    analyzer.ball_size = 1.0\n    analyzer.prev_motion = {'dx': -3, 'dy': 38, 'distance': math.hypot(3, 38)}\n    analyzer.last_motion = {'dx': 21, 'dy': -40, 'distance': math.hypot(21, 40)}\n    analyzer._last_direction_change_frame = 2930\n    analyzer._last_direction_change_vertical_reversal = True\n    analyzer._last_direction_change_point = (2153, 262)\n    analyzer._player_reacq_protect_until_frame = 3002\n    analyzer._point_outside_singles_court = lambda point, frame: (True, 'far baseline', None, None, None, None)\n    analyzer._classify_ground_bounce = lambda point, frame: (False, 'Ball bounce outside singles court (far baseline)', (0, 0, 255))\n    frame = np.zeros((2160, 3840, 3), dtype=np.uint8)\n    ended, reason = analyzer._confirmed_boundary_reversal_out_candidate(analyzer.ball_center, frame)\n    assert ended\n    assert reason == 'Ball bounce outside singles court (far baseline)'\n'''
          tests = tests.replace(anchor, extra + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          python -m py_compile interactive_ball_analyzer.py tests/test_recovered_serve_scoring.py
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-last-far-out.yml
          git add interactive_ball_analyzer.py tests/test_recovered_serve_scoring.py
          git commit -m "Let stale serve state yield to rally out"
          git push origin HEAD:revert_1
