name: Inspect post-serve handoff

on:
  push:
    branches:
      - revert_1
    paths:
      - .github/workflows/inspect-post-serve-handoff.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Print handoff code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('interactive_ball_analyzer.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          needles = [
              '_post_serve_launch_lock_until_frame',
              'POST_SERVE_LAUNCH_LOCK',
              '_discard_provisional_serve_from_ai',
              '_post_serve_launch_lock_last_reject_frame',
          ]
          for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle in line]
              print(f'\n===== {needle}: {[i+1 for i in hits]} =====')
              for i in hits:
                  start = max(0, i - 16)
                  end = min(len(lines), i + 28)
                  for n in range(start, end):
                      print(f'{n+1:05d}: {lines[n]}')
                  print('---')
          PY
