name: Apply Local AI debug patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch analyzer
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_local_ai_debug.py
          python /tmp/patch_local_ai_debug.py
          python -m py_compile interactive_ball_analyzer.py
          grep -n 'trajectory_cost=' interactive_ball_analyzer.py
          grep -n 'normal_ref=' interactive_ball_analyzer.py

      - name: Commit analyzer debug patch
        shell: bash
        run: |
          rm .github/workflows/apply_local_ai_debug.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interactive_ball_analyzer.py .github/workflows/apply_local_ai_debug.yml
          git commit -m 'Add Local AI candidate debug metrics'
          git push origin HEAD:revert_1
