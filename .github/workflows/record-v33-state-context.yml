name: Record V33 state context

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0
      - name: Record source context
        run: python tools/record_v33_state_context.py
      - name: Commit context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V33_POST_TRACK_CONTEXT.md
          if git diff --cached --quiet; then
            echo "No context changes"
            exit 0
          fi
          git commit -m "Record V33 post-track state context"
          git push origin HEAD:codex/shallow-serve-turn-candidate
