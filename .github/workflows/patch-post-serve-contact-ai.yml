name: Patch post-serve CONTACT_LOCAL_AI consensus

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch analyzer
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_contact_ai.py
          python /tmp/patch_contact_ai.py
          python -m py_compile interactive_ball_analyzer.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-post-serve-contact-ai.yml
          git add interactive_ball_analyzer.py
          git commit -m "Prefer post-serve AI candidate matching normal trajectory"
          git push origin HEAD:revert_1
