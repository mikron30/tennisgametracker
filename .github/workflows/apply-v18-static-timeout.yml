name: Apply V18 static timeout suppression

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate
    paths:
      - .github/workflows/apply-v18-static-timeout.yml

permissions:
  contents: write

jobs:
  apply-v18:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply V18 patch
        run: python tools/apply_v18_static_timeout_suppression.py

      - name: Commit patched tracker
        shell: bash
        run: |
          if git diff --quiet -- interactive_ball_analyzer.py; then
            echo "V18 was already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Apply V18 static timeout suppression"
          git push origin HEAD:codex/shallow-serve-turn-candidate
