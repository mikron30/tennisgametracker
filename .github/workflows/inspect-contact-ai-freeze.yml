name: Inspect contact AI freeze
on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/inspect-contact-ai-freeze.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Extract contact AI methods and call sites
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('interactive_ball_analyzer.py')
          text=p.read_text(encoding='utf-8')
          lines=text.splitlines()
          wanted={'_contact_local_ai_trigger','_run_contact_local_ai_frame','_force_local_ai_frame'}
          tree=ast.parse(text)
          for n in ast.walk(tree):
              if isinstance(n,ast.FunctionDef) and n.name in wanted:
                  print(f'\n===== {n.name} {n.lineno}-{n.end_lineno} =====')
                  print('\n'.join(lines[n.lineno-1:n.end_lineno]))
          for needle in ['_contact_local_ai_trigger(', '_run_contact_local_ai_frame(', '[CONTACT_LOCAL_AI_ARM]']:
              print(f'\n===== CALLS {needle} =====')
              for i,l in enumerate(lines,1):
                  if needle in l:
                      a=max(1,i-30); b=min(len(lines),i+45)
                      print(f'--- around {i} ---')
                      print('\n'.join(f'{j}: {lines[j-1]}' for j in range(a,b+1)))
          PY
