name: Fix trajectory Local AI trigger v2

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'Run trajectory Local AI trigger v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_trajectory_local_ai_v2.py
      - name: Syntax check
        run: python -m py_compile interactive_ball_analyzer.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Fix automatic Local AI hotspot escalation"
          git push origin HEAD:revert_1
