name: Inspect current trajectory hotspot bridge
on:
  push:
    branches: [revert_1]
    paths:
      - '.github/workflows/inspect-current-hotspot-bridge.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Print false-positive guard metadata assignment
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          for a,b in [(18100,18190),(17280,17540)]:
            print(f'\n===== SOURCE {a}:{b} =====')
            for j in range(a-1,min(b,len(lines))):
              print(f'{j+1:6d}: {lines[j]}')
          PY
