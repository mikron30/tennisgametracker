name: Inspect current trajectory hotspot bridge
on:
  push:
    branches: [revert_1]
    paths:
      - '.github/workflows/inspect-current-hotspot-bridge.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Print selected metadata handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          needles=[
            'selected_meta_for_guard =',
            '_prefer_predicted_continuation_candidate(',
            'trajectory_continuation_selected',
          ]
          hits=[]
          for needle in needles:
            for i,line in enumerate(lines):
              if needle in line:
                hits.append((i,needle))
          for i,needle in hits:
            a=max(0,i-130); b=min(len(lines),i+170)
            print(f'\n===== {needle} at {i+1}; lines {a+1}-{b} =====')
            for j in range(a,b):
              print(f'{j+1:6d}: {lines[j]}')
          PY
