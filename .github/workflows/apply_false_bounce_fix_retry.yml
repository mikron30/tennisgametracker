name: Retry false serve bounce fix
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/apply_false_bounce_fix_retry.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Extract and apply tested patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/inspect_false_serve_bounce.yml').read_text(encoding='utf-8').splitlines()
          marker = "          cat > /tmp/fix.patch <<'PATCH'"
          start = source.index(marker) + 1
          end = next(i for i in range(start, len(source)) if source[i] == '          PATCH')
          patch_lines = []
          for line in source[start:end]:
              patch_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/fix.patch').write_text('\n'.join(patch_lines) + '\n', encoding='utf-8')
          PY
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          python -m py_compile interactive_ball_analyzer.py
      - name: Verify regression guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          source = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          methods = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
          assert '_resume_false_serve_bounce_from_motion' in methods
          assert '[SERVE-BOUNCE MOTION OVERRIDE]' in source
          assert 'pending_reason, tracked_position' in source
          print('syntax/regression guard PASS')
          PY
      - name: Commit tracker fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interactive_ball_analyzer.py
          git commit -m 'Prevent stale serve-bounce fault on continuing ball'
          git push origin HEAD:revert_1
