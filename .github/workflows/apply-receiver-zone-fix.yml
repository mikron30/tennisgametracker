name: Apply receiver zone fix

on:
  push:
    branches: [revert_1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Patch receiver and player-zone geometry
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          python -m py_compile player_racket_tracker.py
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-receiver-zone-fix.yml
          git add player_racket_tracker.py .github/workflows/apply-receiver-zone-fix.yml
          git commit -m 'Reject implausible receiver player zones'
          git push origin HEAD:revert_1
