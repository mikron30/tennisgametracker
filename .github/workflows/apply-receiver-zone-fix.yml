name: Apply receiver zone fix
on:
  push:
    branches: [revert_1]
    paths:
      - '.github/workflows/apply-receiver-zone-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch player receiver geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('player_racket_tracker.py')
          text = path.read_text(encoding='utf-8')

          old_receiver = '''    def _receiver_detection_for_server(self, server_side: Optional[str]) -> Optional[Dict]:
        """Choose the receiver on the opposite side of the net."""
        if server_side not in ("near", "far"):
            return None
        desired_side = "far" if server_side == "near" else "near"
        choices = []
        for detection in self.last_detections:
            box = detection.get("bbox") if isinstance(detection, dict) else None
            if not box:
                continue
            center = self._box_center(box)
            if not self._center_is_in_court(center):
                continue
            side = self._side_for_box(box, self.frame_shape[0] if self.frame_shape else 2160)
            if side != desired_side:
                continue
            _, _, w, h = box
            shape_penalty = abs((float(h) / max(float(w), 1.0)) - 2.0) * 0.12
            score = shape_penalty - float(detection.get("score", 0.0)) * 0.20
            choices.append((score, detection, side, center))
        if not choices:
            for track in self.tracks.values():
                if track.side != desired_side or track.bbox is None or track.center is None:
                    continue
                if not self._center_is_in_court(track.center):
                    continue
                _, _, w, h = track.bbox
                score = abs((float(h) / max(float(w), 1.0)) - 2.0) * 0.12 - track.confidence * 0.20
                choices.append((score, track, desired_side, track.center))
        if not choices:
            return None
        _, selected, side, center = min(choices, key=lambda item: item[0])
        if isinstance(selected, PlayerTrack):
            return {
                "bbox": list(selected.bbox),
                "center": list(center),
                "side": side,
                "source": "tracked_receiver_opposite_side",
            }
        result = dict(selected)
        result.update({
            "bbox": list(result["bbox"]),
            "center": list(center),
            "side": side,
            "source": "serve_detection_opposite_side",
        })
        return result
'''

          new_receiver = '''    def _box_is_plausible_for_side(self, box: BBox, side: str) -> bool:
        """Reject player boxes whose body lies implausibly across the net plane.

        ``_side_for_box`` intentionally classifies from the box center only.  That
        is useful for general tracking, but it is too permissive for player-zone
        exclusions: a huge false box can have a far-side center while extending
        hundreds of pixels onto the near court.  Such a box must never create a
        head/shoe/body exclusion zone for the ball tracker.
        """
        if side not in ("near", "far") or not box or len(box) != 4:
            return False
        x, y, w, h = [float(v) for v in box]
        if w <= 0.0 or h <= 0.0:
            return False
        if self.frame_shape is None:
            return True

        frame_height = float(self.frame_shape[0])
        net_y = float(self.net_y) if self.net_y is not None else frame_height * 0.5
        # Detector boxes can overshoot the feet/head a little, especially with
        # motion contours.  Allow a modest scale-aware margin, but not a body
        # that crosses deeply through the net plane.
        overshoot = max(30.0, min(100.0, h * 0.12))

        if side == "far":
            if y + h > net_y + overshoot:
                return False
            # A far-court receiver occupying almost a third of a 4K frame is
            # normally a merged motion/HOG false box, not the distant player.
            if h > frame_height * 0.30:
                return False
        else:
            if y < net_y - overshoot:
                return False
        return True

    def _receiver_detection_for_server(self, server_side: Optional[str]) -> Optional[Dict]:
        """Choose the receiver on the opposite side of the net."""
        if server_side not in ("near", "far"):
            return None
        desired_side = "far" if server_side == "near" else "near"
        choices = []
        for detection in self.last_detections:
            box = detection.get("bbox") if isinstance(detection, dict) else None
            if not box:
                continue
            center = self._box_center(box)
            if not self._center_is_in_court(center):
                continue
            side = self._side_for_box(box, self.frame_shape[0] if self.frame_shape else 2160)
            if side != desired_side:
                continue
            if not self._box_is_plausible_for_side(box, side):
                continue
            _, _, w, h = box
            shape_penalty = abs((float(h) / max(float(w), 1.0)) - 2.0) * 0.12
            score = shape_penalty - float(detection.get("score", 0.0)) * 0.20
            choices.append((score, detection, side, center))
        if not choices:
            for track in self.tracks.values():
                if track.side != desired_side or track.bbox is None or track.center is None:
                    continue
                if not self._center_is_in_court(track.center):
                    continue
                if not self._box_is_plausible_for_side(track.bbox, track.side):
                    continue
                _, _, w, h = track.bbox
                score = abs((float(h) / max(float(w), 1.0)) - 2.0) * 0.12 - track.confidence * 0.20
                choices.append((score, track, desired_side, track.center))
        if not choices:
            return None
        _, selected, side, center = min(choices, key=lambda item: item[0])
        if isinstance(selected, PlayerTrack):
            return {
                "bbox": list(selected.bbox),
                "center": list(center),
                "side": side,
                "source": "tracked_receiver_opposite_side",
            }
        result = dict(selected)
        result.update({
            "bbox": list(result["bbox"]),
            "center": list(center),
            "side": side,
            "source": "serve_detection_opposite_side",
        })
        return result
'''

          if old_receiver not in text:
              raise SystemExit('receiver function block not found')
          text = text.replace(old_receiver, new_receiver, 1)

          old_adopt = '''            track = self.tracks[side]
            track.bbox = tuple(int(v) for v in bbox)
            track.center = self._box_center(track.bbox)
'''
          new_adopt = '''            track_bbox = tuple(int(v) for v in bbox)
            if prefix == "receiver" and not self._box_is_plausible_for_side(track_bbox, side):
                continue
            track = self.tracks[side]
            track.bbox = track_bbox
            track.center = self._box_center(track.bbox)
'''
          if old_adopt not in text:
              raise SystemExit('adopt block not found')
          text = text.replace(old_adopt, new_adopt, 1)

          old_shoes = '            track.shoes = (int(round(x + w * 0.96)), int(round(y + h * 0.96)))\n'
          new_shoes = '            track.shoes = (int(round(x + w * 0.5)), int(round(y + h * 0.96)))\n'
          if old_shoes not in text:
              raise SystemExit('adopt shoes typo line not found')
          text = text.replace(old_shoes, new_shoes, 1)

          old_zone = '''        track = self._track_for_point(point)
        if track is None or track.bbox is None or float(track.confidence) < 0.30:
            return None
        x, y, w, h = track.bbox
'''
          new_zone = '''        track = self._track_for_point(point)
        if track is None or track.bbox is None or float(track.confidence) < 0.30:
            return None
        # Never let an obviously cross-net false player box manufacture a
        # player_shoes/player_head/player_body zone around a genuine ball.
        if not self._box_is_plausible_for_side(track.bbox, track.side):
            return None
        x, y, w, h = track.bbox
'''
          if old_zone not in text:
              raise SystemExit('point_zone block not found')
          text = text.replace(old_zone, new_zone, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile player_racket_tracker.py
          git diff --check
      - name: Commit fix and remove patcher
        shell: bash
        run: |
          rm .github/workflows/apply-receiver-zone-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player_racket_tracker.py .github/workflows/apply-receiver-zone-fix.yml
          git commit -m 'Reject implausible receiver player zones'
          git push origin HEAD:revert_1
