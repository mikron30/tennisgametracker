name: Apply player-jump rollback guard

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revert_1
        uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch catastrophic player-jump rollback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("interactive_ball_analyzer.py")
          text = path.read_text(encoding="utf-8")
          nl = "\r\n" if "\r\n" in text else "\n"

          marker = "[LOCAL_AI_PLAYER_JUMP_ROLLBACK]"
          if marker not in text:
              anchor = (
                  '            print(f"[LOCAL_AI_RECOVERY] f{self.frame_count}: no safe path ({reason})")' + nl +
                  '            # Do not let a local-AI rejection still mutate the track.  In the'
              )
              if text.count(anchor) != 1:
                  raise RuntimeError(f"Expected exactly one local-AI rejection anchor, found {text.count(anchor)}")

              rollback = (
                  '            print(f"[LOCAL_AI_RECOVERY] f{self.frame_count}: no safe path ({reason})")' + nl +
                  '            # If HSV just teleported from a physically coherent ball path into a' + nl +
                  '            # player region and local AI could not verify a replacement, never let' + nl +
                  '            # that player pixel become the next-frame anchor. Restore the complete' + nl +
                  '            # pre-track state (position, size, motion and velocity history) and let' + nl +
                  '            # the rapid AI retry continue from the last sane trajectory.' + nl +
                  '            if (' + nl +
                  '                    reason.startswith("player-region:") and' + nl +
                  '                    pre_track_snapshot is not None and' + nl +
                  '                    previous_position is not None and' + nl +
                  '                    tracked_position is not None):' + nl +
                  '                player_jump = math.hypot(' + nl +
                  '                    float(tracked_position[0]) - float(previous_position[0]),' + nl +
                  '                    float(tracked_position[1]) - float(previous_position[1]),' + nl +
                  '                )' + nl +
                  '                prior_motion = pre_track_snapshot.get("last_motion") or {}' + nl +
                  '                prior_speed = float(prior_motion.get("distance", 0.0) or 0.0)' + nl +
                  '                prior_velocities = pre_track_snapshot.get("ball_velocity_history") or []' + nl +
                  '                if prior_velocities:' + nl +
                  '                    prior_speed = max(' + nl +
                  '                        prior_speed,' + nl +
                  '                        max(float(value or 0.0) for value in prior_velocities[-3:]),' + nl +
                  '                    )' + nl +
                  '                jump_limit = max(150.0, min(520.0, prior_speed * 3.2 + 60.0))' + nl +
                  '                if player_jump > jump_limit:' + nl +
                  '                    rejected_position = tuple(tracked_position)' + nl +
                  '                    self._restore_tracking_state_for_provisional_guard(pre_track_snapshot)' + nl +
                  '                    self.stuck_frame_count = int(previous_stuck) + 1' + nl +
                  '                    if getattr(self, "_last_motion_reacq_frame", -1000000) == self.frame_count:' + nl +
                  '                        self._last_motion_reacq_frame = -1000000' + nl +
                  '                        self._last_motion_reacq_pos = None' + nl +
                  '                    print(' + nl +
                  '                        f"[LOCAL_AI_PLAYER_JUMP_ROLLBACK] f{self.frame_count}: "' + nl +
                  '                        f"rejected {rejected_position} jump={player_jump:.1f}px > "' + nl +
                  '                        f"{jump_limit:.1f}px; restored {previous_position} "' + nl +
                  '                        f"stuck={self.stuck_frame_count}"' + nl +
                  '                    )' + nl +
                  '                    return previous_position' + nl +
                  '            # Do not let a local-AI rejection still mutate the track.  In the'
              )
              text = text.replace(anchor, rollback, 1)
              path.write_text(text, encoding="utf-8")
              print("Applied catastrophic player-jump rollback guard")
          else:
              print("Player-jump rollback guard already present")
          PY

      - name: Syntax check
        shell: bash
        run: python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/apply-player-jump-rollback.yml
          git add interactive_ball_analyzer.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Rollback catastrophic player-region tracking jumps"
          git push origin HEAD:revert_1
