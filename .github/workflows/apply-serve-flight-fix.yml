name: Apply serve-flight tracking patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch first-serve flight tracking
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_serve_flight_fix.py
          python /tmp/apply_serve_flight_fix.py
          rm -f .github/workflows/apply-serve-flight-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock accepted serve to ball trajectory"
          git push
