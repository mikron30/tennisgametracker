name: Inspect auto-run flag behavior

on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/inspect-auto-run-flags.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Extract concise flag and report behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          needles = ['auto_run','auto-run','auto_play','auto-play','point_history','POINT_HISTORY','POINT_AUDIT','waitKey(','imshow(']
          out=[]; seen=set()
          for needle in needles:
              matches=[i for i,l in enumerate(src) if needle in l]
              if not matches: continue
              out.append(f'## {needle}')
              for i in matches:
                  start=max(0,i-4); end=min(len(src),i+5)
                  key=(start,end)
                  if key in seen: continue
                  seen.add(key)
                  out.extend(f'{j+1:06d}: {src[j]}' for j in range(start,end))
          Path('.github/auto_run_flag_context.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/auto_run_flag_context.txt
          git commit -m "Extract concise auto-run flag context"
          git push origin HEAD:revert_1
