name: Apply generic contact AI fix current
on:
  push:
    branches:
      - revert_1
    paths:
      - .github/workflows/apply-contact-ai-fix-current.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - run: python .github/scripts/fix_contact_ai_freeze.py
      - run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py
          grep -q 'CONTACT_LOCAL_AI_FALLBACK' interactive_ball_analyzer.py
          grep -q '_contact_local_ai_watch_until_frame' interactive_ball_analyzer.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interactive_ball_analyzer.py
          git commit -m 'Make racket-contact Local AI non-blocking'
          git push origin HEAD:revert_1
