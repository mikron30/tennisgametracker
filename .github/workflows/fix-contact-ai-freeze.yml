name: Fix generic contact AI freeze
on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/fix-contact-ai-freeze.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch generic contact AI assist
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path=Path('interactive_ball_analyzer.py')
          src=path.read_text(encoding='utf-8')
          tree=ast.parse(src)

          replacements={
          '_contact_local_ai_trigger': r'''    def _contact_local_ai_trigger(self, previous_position, tracked_position, snapshot):
        """Return a generic racket-contact takeover reason for suspicious tracking.

        Near-player contact first opens a short *watch* window.  Merely touching
        a player/head/shoe zone is not enough to replace HSV.  Local AI takes
        ownership only when the track then shows physical evidence of a hit,
        loss, stall, jump, turn, or contour discontinuity.  This keeps the rule
        generic for serves and rally strokes without freezing on player pixels.
        """
        current = int(self.frame_count)
        if (
                getattr(self, 'local_ai_recovery', None) is None or
                previous_position is None or
                current <= int(getattr(
                    self, '_contact_local_ai_cooldown_until_frame', -1000000
                ))):
            return None

        previous = (int(previous_position[0]), int(previous_position[1]))
        watch_until = int(getattr(self, '_contact_local_ai_watch_until_frame', -1000000))
        watch_active = current <= watch_until

        # If the normal tracker loses the ball immediately after it entered a
        # player/racket corridor, that is itself strong contact evidence.
        if tracked_position is None:
            if watch_active:
                return 'contact-loss-after-player-proximity'
            return None

        tracked = (int(tracked_position[0]), int(tracked_position[1]))
        prior_motion = dict((snapshot or {}).get('last_motion') or {})
        prior_dx = float(prior_motion.get('dx', 0.0) or 0.0)
        prior_dy = float(prior_motion.get('dy', 0.0) or 0.0)
        prior_speed = float(
            prior_motion.get('distance', math.hypot(prior_dx, prior_dy)) or 0.0
        )
        proposed_dx = float(tracked[0] - previous[0])
        proposed_dy = float(tracked[1] - previous[1])
        proposed_speed = math.hypot(proposed_dx, proposed_dy)

        predicted = (
            int(round(float(previous[0]) + prior_dx)),
            int(round(float(previous[1]) + prior_dy)),
        )
        prediction_error = math.hypot(
            float(tracked[0] - predicted[0]), float(tracked[1] - predicted[1])
        )

        angle_delta = 0.0
        if prior_speed >= 4.0 and proposed_speed >= 4.0:
            prior_angle = math.degrees(math.atan2(prior_dy, prior_dx))
            proposed_angle = math.degrees(math.atan2(proposed_dy, proposed_dx))
            raw_delta = abs(proposed_angle - prior_angle) % 360.0
            angle_delta = min(raw_delta, 360.0 - raw_delta)

        zone = self._player_point_zone(tracked)
        geometric_contact_near = any(
            self._point_in_player_contact_corridor(point)
            for point in (previous, tracked, predicted)
        )
        player_zones = (
            'player_head_hat', 'player_body', 'player_shoes', 'racket_fragment'
        )

        # Proximity is a watch signal, not an automatic takeover.  It lets the
        # next few frames trigger even after the outgoing ball has left the box.
        if zone in player_zones or geometric_contact_near:
            self._contact_local_ai_watch_until_frame = max(watch_until, current + 8)
            watch_active = True

        contact_context = geometric_contact_near or watch_active
        if not contact_context:
            return None

        recent_speeds = [
            float(value) for value in (snapshot or {}).get('ball_velocity_history', [])[-5:]
            if value is not None
        ]
        recent_median = float(np.median(recent_speeds)) if recent_speeds else prior_speed
        jump_floor = max(70.0, recent_median * 1.8, prior_speed * 1.55)

        previous_size = float((snapshot or {}).get('ball_size', 0.0) or 0.0)
        proposed_size = float(getattr(self, 'ball_size', 0.0) or 0.0)
        size_ratio = (
            max(previous_size, proposed_size) / max(1.0, min(previous_size, proposed_size))
            if previous_size > 0.0 and proposed_size > 0.0 else 1.0
        )

        if (
                proposed_speed >= jump_floor and
                (angle_delta >= 35.0 or prediction_error >= 50.0)):
            return (
                f'contact-jump:{proposed_speed:.0f}px>={jump_floor:.0f}/'
                f'angle={angle_delta:.0f}deg/pred={prediction_error:.0f}px'
            )

        if (
                prior_speed >= 18.0 and proposed_speed >= 18.0 and
                angle_delta >= 70.0 and prediction_error >= 30.0):
            return (
                f'contact-turn:{angle_delta:.0f}deg/'
                f'pred={prediction_error:.0f}px'
            )

        # A fast incoming ball that suddenly becomes almost static next to the
        # player is a classic HSV latch onto body/racket/shoes.
        if (
                prior_speed >= 18.0 and
                proposed_speed <= max(6.0, prior_speed * 0.35) and
                prediction_error >= 18.0):
            return (
                f'contact-stall:{prior_speed:.0f}->{proposed_speed:.0f}px/'
                f'pred={prediction_error:.0f}px'
            )

        if (
                proposed_speed >= 35.0 and size_ratio >= 2.6 and
                prediction_error >= 35.0):
            return (
                f'contact-size-jump:{size_ratio:.1f}x/'
                f'pred={prediction_error:.0f}px'
            )

        # A player-zone contour only becomes a takeover trigger when it also
        # disagrees materially with the incoming trajectory.  Proximity alone
        # remains a watch signal.
        if (
                zone in player_zones and prediction_error >= 30.0 and
                (angle_delta >= 30.0 or size_ratio >= 2.0)):
            return (
                f'contact-player-artifact:{zone}/step={proposed_speed:.0f}px/'
                f'angle={angle_delta:.0f}deg/pred={prediction_error:.0f}px'
            )
        return None
''',
          '_run_contact_local_ai_frame': r'''    def _run_contact_local_ai_frame(self, frame, previous_position, arm_reason=None):
        """Run generic Local-AI racket-contact assist without freezing tracking.

        AI may own the ball only when it actually produces a clear accepted
        candidate.  On an AI miss the state remains armed, but this method
        returns None so the normal tracker can process the same frame.  The
        search widens after misses and scores a larger candidate pool because a
        fast outgoing ball can move far from the player immediately after hit.
        """
        recovery = getattr(self, 'local_ai_recovery', None)
        if recovery is None or frame is None or previous_position is None:
            return None

        current = int(self.frame_count)
        state = getattr(self, '_contact_local_ai_state', None)
        if arm_reason is not None and not isinstance(state, dict):
            state = {
                'start_frame': current,
                'deadline': current + 22,
                'history': [],
                'outside_count': 0,
                'miss_count': 0,
                'reason': str(arm_reason),
            }
            self._contact_local_ai_state = state
            self._local_ai_tight_roi_follow = None
            print(
                f"[CONTACT_LOCAL_AI_ARM] f{current}: anchor={tuple(previous_position)} "
                f"reason={arm_reason} radius={self._contact_local_ai_radius:.0f}px"
            )

        state = getattr(self, '_contact_local_ai_state', None)
        if not isinstance(state, dict):
            return None
        if current > int(state.get('deadline', -1)):
            print(
                f"[CONTACT_LOCAL_AI_EXPIRE] f{current}: "
                f"started=f{state.get('start_frame')} reason={state.get('reason')}"
            )
            self._contact_local_ai_state = None
            self._contact_local_ai_cooldown_until_frame = current + 3
            return None

        miss_count = int(state.get('miss_count', 0))
        base_radius = float(getattr(self, '_contact_local_ai_radius', 450.0))
        contact_radius = min(900.0, base_radius + 90.0 * miss_count)

        saved_range = getattr(self, '_force_local_ai_range', None)
        saved_history = list(getattr(self, '_force_local_ai_history', []) or [])
        saved_radius = float(getattr(self, '_force_local_ai_radius', 450.0))
        saved_min_score = float(getattr(self, '_force_local_ai_min_score', 0.985))
        saved_return_none = bool(getattr(self, '_force_local_ai_return_none_on_miss', False))
        saved_max_scored = int(getattr(self, '_force_local_ai_max_score_candidates', 128))
        try:
            self._force_local_ai_range = (
                int(state['start_frame']), int(state['deadline'])
            )
            self._force_local_ai_history = list(state.get('history', []) or [])
            self._force_local_ai_radius = contact_radius
            self._force_local_ai_min_score = float(
                getattr(self, '_contact_local_ai_min_score', 0.985)
            )
            self._force_local_ai_return_none_on_miss = True
            self._force_local_ai_max_score_candidates = 384
            selected = self._force_local_ai_frame(frame, previous_position)
            state['history'] = list(getattr(self, '_force_local_ai_history', []) or [])
        finally:
            self._force_local_ai_range = saved_range
            self._force_local_ai_history = saved_history
            self._force_local_ai_radius = saved_radius
            self._force_local_ai_min_score = saved_min_score
            self._force_local_ai_return_none_on_miss = saved_return_none
            self._force_local_ai_max_score_candidates = saved_max_scored

        if selected is None:
            state['miss_count'] = miss_count + 1
            self._contact_local_ai_state = state
            print(
                f"[CONTACT_LOCAL_AI_MISS] f{current}: normal tracker remains active; "
                f"misses={state['miss_count']} next_radius="
                f"{min(900.0, base_radius + 90.0 * state['miss_count']):.0f}px"
            )
            return None

        state['miss_count'] = 0
        selected = (int(selected[0]), int(selected[1]))
        zone = self._player_point_zone(selected)
        inside_contact = self._point_in_player_contact_corridor(selected)
        age = current - int(state['start_frame'])
        if zone is None and not inside_contact:
            state['outside_count'] = int(state.get('outside_count', 0)) + 1
        else:
            state['outside_count'] = 0

        print(
            f"[CONTACT_LOCAL_AI] f{current}: selected={selected} age={age}f "
            f"outside={state['outside_count']} zone={zone}"
        )

        if age >= 5 and int(state.get('outside_count', 0)) >= 3:
            print(
                f"[CONTACT_LOCAL_AI_HANDOFF] f{current}: selected={selected} "
                f"clear of player/contact corridor for {state['outside_count']}f"
            )
            self._contact_local_ai_state = None
            self._contact_local_ai_cooldown_until_frame = current + 3
        else:
            self._contact_local_ai_state = state
        return selected
'''
          }

          lines=src.splitlines(keepends=True)
          spans=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.FunctionDef) and node.name in replacements:
                  spans.append((node.lineno,node.end_lineno,node.name))
          if {n for _,_,n in spans} != set(replacements):
              raise SystemExit('Could not find contact AI methods exactly')
          for a,b,name in sorted(spans, reverse=True):
              lines[a-1:b]=[replacements[name]]
          src=''.join(lines)

          old='''        subset = clear_candidates[:128]\n        scored = recovery._score(frame, current, subset) if subset else []\n'''
          new='''        max_scored = max(32, min(512, int(getattr(\n            self, "_force_local_ai_max_score_candidates", 128\n        ))))\n        subset = clear_candidates[:max_scored]\n        scored = recovery._score(frame, current, subset) if subset else []\n'''
          if src.count(old) != 1:
              raise SystemExit(f'Expected one force-AI 128 subset, got {src.count(old)}')
          src=src.replace(old,new,1)

          old='''        if not eligible:\n            self.ball_center = tuple(anchor)\n            self.stuck_frame_count = max(1, int(getattr(self, "stuck_frame_count", 0)) + 1)\n            print(\n                f"[FORCE_LOCAL_AI_HOLD] f{current}: no clear candidate >= {min_score:.3f}; "\n                f"anchor={anchor} predicted={predicted} candidates={len(candidates)} "\n                f"clear={len(clear_candidates)} scored={len(scored)}"\n            )\n            return tuple(anchor)\n'''
          new='''        if not eligible:\n            if bool(getattr(self, "_force_local_ai_return_none_on_miss", False)):\n                print(\n                    f"[FORCE_LOCAL_AI_MISS] f{current}: no clear candidate >= {min_score:.3f}; "\n                    f"anchor={anchor} predicted={predicted} candidates={len(candidates)} "\n                    f"clear={len(clear_candidates)} scored={len(scored)}"\n                )\n                return None\n            self.ball_center = tuple(anchor)\n            self.stuck_frame_count = max(1, int(getattr(self, "stuck_frame_count", 0)) + 1)\n            print(\n                f"[FORCE_LOCAL_AI_HOLD] f{current}: no clear candidate >= {min_score:.3f}; "\n                f"anchor={anchor} predicted={predicted} candidates={len(candidates)} "\n                f"clear={len(clear_candidates)} scored={len(scored)}"\n            )\n            return tuple(anchor)\n'''
          if src.count(old) != 1:
              raise SystemExit(f'Expected one force-AI hold block, got {src.count(old)}')
          src=src.replace(old,new,1)

          old='''                            contact_reason = self._contact_local_ai_trigger(\n                                prev_ball_center, tracked_position, pre_track_snapshot\n                            )\n                            if contact_reason is not None:\n                                rejected_hsv = (\n                                    tuple(tracked_position)\n                                    if tracked_position is not None else None\n                                )\n                                self._restore_tracking_state_for_provisional_guard(\n                                    pre_track_snapshot\n                                )\n'''
          new='''                            contact_reason = self._contact_local_ai_trigger(\n                                prev_ball_center, tracked_position, pre_track_snapshot\n                            )\n                            if contact_reason is not None:\n                                rejected_hsv = (\n                                    tuple(tracked_position)\n                                    if tracked_position is not None else None\n                                )\n                                post_track_snapshot = self._snapshot_tracking_state_for_provisional_guard()\n                                self._restore_tracking_state_for_provisional_guard(\n                                    pre_track_snapshot\n                                )\n'''
          if src.count(old) != 1:
              raise SystemExit(f'Expected one contact arm callsite block, got {src.count(old)}')
          src=src.replace(old,new,1)

          old='''                                else:\n                                    # A failed AI arm must not leave state partially\n                                    # rolled back.  Hold the last trusted ball and retry\n                                    # on the next frame rather than accepting player HSV.\n                                    self.ball_center = tuple(prev_ball_center)\n                                    self.stuck_frame_count = max(\n                                        1, int(prev_stuck) + 1\n                                    )\n                                    tracked_position = tuple(prev_ball_center)\n                                    contact_local_ai = True\n'''
          new='''                                else:\n                                    # Contact AI is an assist, not a freeze. Restore the\n                                    # normal track result for this frame and keep the AI\n                                    # watch armed for a later outgoing-ball candidate.\n                                    self._restore_tracking_state_for_provisional_guard(\n                                        post_track_snapshot\n                                    )\n                                    tracked_position = rejected_hsv\n                                    contact_local_ai = False\n                                    print(\n                                        f"[CONTACT_LOCAL_AI_FALLBACK] f{self.frame_count}: "\n                                        f"AI miss; keeping normal={tracked_position}"\n                                    )\n'''
          if src.count(old) != 1:
              raise SystemExit(f'Expected one failed-arm hold block, got {src.count(old)}')
          src=src.replace(old,new,1)

          path.write_text(src,encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          tree=ast.parse(s)
          names={n.name for n in ast.walk(tree) if isinstance(n,ast.FunctionDef)}
          required={'load_hsv_config','track_ball_in_frame','detect_serve_position','_contact_local_ai_trigger','_run_contact_local_ai_frame','_force_local_ai_frame'}
          assert required <= names, required-names
          assert 'disable_specific_frame_logic' not in s
          assert '--disable-specific-frame-logic' not in s
          assert '_force_local_ai_return_none_on_miss' in s
          assert '_force_local_ai_max_score_candidates' in s
          assert '[CONTACT_LOCAL_AI_FALLBACK]' in s
          assert '[CONTACT_LOCAL_AI_MISS]' in s
          print('CONTACT_AI_NO_FREEZE_OK')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Make racket-contact Local AI non-blocking"
          git push origin HEAD:revert_1
