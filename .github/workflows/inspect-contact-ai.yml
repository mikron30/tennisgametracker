name: Inspect contact AI integration points

on:
  push:
    branches:
      - revert_1
    paths:
      - .github/workflows/inspect-contact-ai.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1

      - name: Extract relevant source contexts
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          needles = [
              'def _player_point_zone',
              '_local_ai_tight_roi_follow',
              'pre_track_snapshot',
              'forced_local_ai = False',
              'def _force_local_ai_frame',
              'def _try_local_ai_recovery',
              'player_tracker.update',
              'classify_stroke',
          ]
          out = []
          seen = set()
          for needle in needles:
              out.append('\n' + '=' * 90)
              out.append(f'NEEDLE: {needle}')
              out.append('=' * 90)
              matches = [i for i, line in enumerate(src) if needle in line]
              if not matches:
                  out.append('NO MATCH')
                  continue
              for i in matches:
                  start = max(0, i - 45)
                  end = min(len(src), i + 85)
                  key = (start, end)
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(f'--- lines {start+1}-{end} ---')
                  for j in range(start, end):
                      out.append(f'{j+1:06d}: {src[j]}')
          Path('.github/contact_ai_context.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/contact_ai_context.txt
          git commit -m "Extract contact AI integration context"
          git push origin HEAD:revert_1
