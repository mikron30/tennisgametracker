name: One-shot shallow serve out fix

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch shallow serve out detection
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_shallow_serve_out.py
          python /tmp/patch_shallow_serve_out.py
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          grep -q "SHALLOW SERVE BOUNCE TURN" interactive_ball_analyzer.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-shallow-serve-out.yml
          git add interactive_ball_analyzer.py
          git commit -m "Detect shallow first-serve bounce outside box"
          git push origin HEAD:revert_1
