name: Inspect far hit current
on:
  push:
    branches:
      - revert_1
permissions:
  contents: write
jobs:
  inspect:
    if: startsWith(github.event.head_commit.message, 'Extract exact far hit logic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Extract exact source ranges
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          ranges=[(12390,12590),(20520,20690),(20970,21180),(9320,9470)]
          out=[]
          for a,b in ranges:
              out.append(f'===== LINES {a}-{b} =====')
              out.extend(f'{n:06d}: {src[n-1]}' for n in range(a,min(b,len(src))+1))
          Path('.github/far_hit_current_sections.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/far_hit_current_sections.txt
          git commit -m "Save exact far hit logic"
          git push origin HEAD:revert_1
