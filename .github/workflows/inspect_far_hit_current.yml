name: Inspect far hit current
on:
  push:
    branches:
      - revert_1
permissions:
  contents: write
jobs:
  inspect:
    if: startsWith(github.event.head_commit.message, 'Extract side recross call logic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Extract side recross logic
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          hits=[i for i,l in enumerate(src,1) if '_maybe_infer_return_contact_from_side_recross' in l or '_side_recross_' in l]
          ranges=[(9380,9540)]
          for i in hits:
              if not (9380 <= i <= 9540): ranges.append((max(1,i-20),min(len(src),i+30)))
          ranges=sorted(ranges)
          merged=[]
          for a,b in ranges:
              if merged and a<=merged[-1][1]+2: merged[-1]=(merged[-1][0],max(merged[-1][1],b))
              else: merged.append((a,b))
          out=['HITS '+repr(hits)]
          for a,b in merged:
              out.append(f'===== LINES {a}-{b} =====')
              out.extend(f'{n:06d}: {src[n-1]}' for n in range(a,b+1))
          Path('.github/far_hit_current_sections.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/far_hit_current_sections.txt
          git commit -m "Save side recross call logic"
          git push origin HEAD:revert_1
