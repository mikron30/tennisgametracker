name: Inspect last hitter logic
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_last_hitter.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Print exact last-hitter reset/update contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          needles=[
            'def reset_for_next_point',
            'def start_new_point',
            'self._last_hitter_side =',
            'self._last_hitter_frame =',
            'self._rally_last_hit_player = None',
            'self._rally_last_hit_frame =',
            "self._serve_state = 'toss'",
            'ball out; hitter unknown, landing-side fallback',
          ]
          printed=set()
          for needle in needles:
            print(f'\n######## NEEDLE: {needle} ########')
            for i,line in enumerate(lines):
              if needle in line:
                start=max(0,i-25); end=min(len(lines),i+55)
                key=(start,end)
                if key in printed:
                  continue
                printed.add(key)
                print(f'\n===== {needle} @ line {i+1} =====')
                for j in range(start,end):
                  print(f'{j+1:06d}: {lines[j]}')
          PY
