name: Inspect current OUT ownership block
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_last_hitter.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Print current OUT scoring code
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          needles = [
              'OUT_SCORE_OWNER',
              'OUT_WINNER_FALLBACK',
              'landing-side fallback',
              'recent_contact',
              'contact_history',
              'primary_bounce_frame',
              '_latest_contact_player_before',
          ]
          printed = set()
          for needle in needles:
              print(f'\n######## {needle} ########')
              matches = [i for i,line in enumerate(lines) if needle in line]
              print('matches:', [i+1 for i in matches])
              for i in matches:
                  start=max(0,i-70); end=min(len(lines),i+90)
                  key=(start,end)
                  if key in printed:
                      continue
                  printed.add(key)
                  for j in range(start,end):
                      print(f'{j+1:06d}: {lines[j]}')
          PY
