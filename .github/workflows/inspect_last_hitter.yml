name: Inspect current point ownership
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_last_hitter.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Inspect contact ownership and point reset
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()

          print('=== POINT/RESET METHOD DEFINITIONS ===')
          for i,line in enumerate(lines):
              if re.match(r'^    def .*?(point|rally|contact|hit)', line, re.I) or re.match(r'^    def .*reset', line, re.I):
                  print(f'{i+1:06d}: {line}')

          print('\n=== CONTACT/HITTER/RALLY STATE ATTRIBUTES ===')
          attrs = {}
          for i,line in enumerate(lines):
              for name in re.findall(r'self\.(_[A-Za-z0-9_]*(?:contact|hitter|rally|hit)[A-Za-z0-9_]*)', line, re.I):
                  attrs.setdefault(name, []).append(i)
          for name, idxs in sorted(attrs.items()):
              print(f'{name}: {len(idxs)} occurrences; lines {[i+1 for i in idxs[:12]]}')

          needles = [
              'recent_contact =',
              'contact_player =',
              'contact_frame =',
              'last hitter missed court',
              'ball out; hitter unknown, landing-side fallback',
              '[OUT_SCORE_OWNER]',
              'def _resolve',
              'def _point_outcome',
              'def reset',
              'point_start_frame_internal =',
          ]
          printed=set()
          for needle in needles:
              print(f'\n######## {needle} ########')
              for i,line in enumerate(lines):
                  if needle in line:
                      start=max(0,i-45); end=min(len(lines),i+75)
                      key=(start,end)
                      if key in printed: continue
                      printed.add(key)
                      for j in range(start,end):
                          print(f'{j+1:06d}: {lines[j]}')
          PY
