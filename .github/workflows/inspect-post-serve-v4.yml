name: Inspect post-serve v4

on:
  push:
    branches:
      - revert_1
    paths:
      - .github/workflows/inspect-post-serve-v4.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Print net crossing and recovery commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          needles = [
              'SERVE-BOUNCE-OUT SUPPRESSED',
              'net_y',
              'crossed_net',
              'net_cross',
              'repaired_position',
              '_awaiting_serve_bounce',
          ]
          printed=set()
          for needle in needles:
              hits=[i for i,line in enumerate(lines) if needle in line]
              print(f'\n===== {needle}: {[i+1 for i in hits]} =====')
              for i in hits:
                  start=max(0,i-28); end=min(len(lines),i+55)
                  key=(start,end)
                  if key in printed: continue
                  printed.add(key)
                  for n in range(start,end):
                      print(f'{n+1:05d}: {lines[n]}')
                  print('---')
          print('\n===== direct recovery commit 1870-1930 =====')
          for n in range(1869, min(1930,len(lines))):
              print(f'{n+1:05d}: {lines[n]}')
          PY
