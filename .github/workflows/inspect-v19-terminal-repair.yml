name: Inspect V19 terminal repair

on:
  push:
    branches:
      - codex/shallow-serve-turn-candidate
    paths:
      - .github/workflows/inspect-v19-terminal-repair.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/shallow-serve-turn-candidate
      - name: Print V19 record-result contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          needles = [
              'def _record_point_result',
              '_terminal_player_overlap_position(',
              '_append_point_history_row(',
              '_in_court_timeout_landing_outcome(',
              'def _determine_point_outcome',
              'def _resolve_point_outcome',
          ]
          printed = set()
          for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle.lower() in line.lower()]
              print(f'\n===== {needle!r}: {len(hits)} hits =====')
              for i in hits[:12]:
                  lo, hi = max(0, i-80), min(len(lines), i+180)
                  key = (lo, hi)
                  if key in printed:
                      continue
                  printed.add(key)
                  print(f'\n--- lines {lo+1}-{hi} (hit {i+1}) ---')
                  for n in range(lo, hi):
                      print(f'{n+1:05d}: {lines[n]}')
          PY
