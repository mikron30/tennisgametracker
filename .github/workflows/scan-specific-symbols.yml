name: Scan specific-frame symbol references

on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/scan-specific-symbols.yml]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Scan symbols
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          toks=['_serve_history_reconciliation','_start_frame_match_seed_applied','_court2_video_phase_seed_applied','_seed_match_state_from_start_frame','_sync_court2_video_phase_from_frame','_is_reviewed_false_serve_start','_court2_false_serve_start_override','_reference_point_end','_reviewed_point_continuation_frame','_point_timeout_result_override','disable_specific_frame_logic']
          out=[]
          for tok in toks:
            out.append('\n## '+tok)
            for i,l in enumerate(src,1):
              if tok in l:
                out.extend(f'{j:06d}: {src[j-1]}' for j in range(max(1,i-3),min(len(src),i+3)+1))
          Path('.github/specific_symbol_scan.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/specific_symbol_scan.txt
          git commit -m "Record specific-frame symbol scan"
          git push origin HEAD:revert_1
