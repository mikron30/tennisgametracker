name: Seed CONTACT_LOCAL_AI outgoing trajectory

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch analyzer
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_contact_ai_seed.py
          python /tmp/patch_contact_ai_seed.py
          python -m py_compile interactive_ball_analyzer.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-contact-ai-seed.yml
          git add interactive_ball_analyzer.py
          git commit -m "Seed contact AI outgoing trajectory"
          git push origin HEAD:revert_1
