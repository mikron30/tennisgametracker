name: Fix far lateral hit
on:
  push:
    branches:
      - revert_1
permissions:
  contents: write
jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'Run far lateral hit patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_far_lateral_hit_patch.py
      - name: Validate
        run: |
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          python -c "from pathlib import Path; t=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8'); assert 'lateral_upper_racket_reversal = (' in t; assert '[UPPER LATERAL RACKET RETURN]' in t"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Recognize lateral far-player racket returns"
          git push origin HEAD:revert_1
