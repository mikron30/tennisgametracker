name: Fix lateral far-player racket returns
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/fix_far_lateral_hit.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch generic far-player hit recognition
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def _upper_racket_contact_turn_candidate_ok(')
          end = text.index('    def _upper_slow_arc_active(', start)
          old = text[start:end]
          new = '''    def _upper_racket_contact_turn_candidate_ok(
        self,
        pos,
        area,
        frame_shape,
        dx,
        dy,
        angle_jump,
        speed_ratio,
        motion_mean=None,
        motion_max=None,
    ):
        """Recognize a far-player racket return after an upper-court stall.

        Two physical signatures are accepted.  The original path handles a
        stalled apex that accelerates downward after contact.  The second path
        handles a lateral racket return: while the ball is nearly stalled on
        the opponent's upper-court side, its horizontal direction reverses and
        speed jumps sharply.  That signature does not require a prior bounce,
        because a legal volley/return can be struck before any rally bounce.
        """
        if self.ball_center is None or self.last_motion is None or self.ball_size is None:
            return False
        if getattr(self, '_awaiting_serve_bounce', False):
            return False
        if getattr(self, 'direction_change_streak', 0) < 2:
            return False

        frame_height, frame_width = frame_shape[:2]
        origin_x, origin_y = self.ball_center
        prev_size = float(self.ball_size)
        prev_dx = float(self.last_motion.get('dx', 0.0))
        prev_dy = float(self.last_motion.get('dy', 0.0))
        prev_speed = float(self.last_motion.get('distance', 0.0))
        cx, cy = pos
        turn_dist = math.hypot(dx, dy)

        if origin_y < max(150, int(frame_height * 0.07)):
            return False
        if origin_y > max(360, int(frame_height * 0.18)):
            return False
        if cy > max(430, int(frame_height * 0.22)):
            return False
        if prev_size > 45.0 or area > 60.0:
            return False
        if prev_dy > 4.0 or prev_speed > 10.0:
            return False

        point_start = getattr(self, 'point_start_frame_internal', None)
        last_contact_frame = int(getattr(self, '_last_racket_contact_frame', -1000000))
        last_contact_player = getattr(self, '_last_racket_contact_player', None)
        candidate_player = self._player_index_at_point(self.ball_center)
        active_previous_hit = (
            point_start is not None and
            last_contact_frame >= int(point_start) and
            last_contact_player in (0, 1)
        )
        opponent_contact_side = (
            active_previous_hit and
            candidate_player in (0, 1) and
            candidate_player != last_contact_player
        )

        # Generic lateral-contact signature.  A natural ball apex may reverse
        # vertical motion because of gravity, but it cannot simultaneously
        # reverse meaningful horizontal motion and accelerate several-fold.
        # Requiring the turn to occur on the opponent's court end ties that
        # physical discontinuity to the only player who could have returned it.
        lateral_upper_racket_reversal = (
            opponent_contact_side and
            abs(prev_dx) >= 2.0 and
            abs(dx) >= 12.0 and
            (prev_dx * float(dx)) <= -24.0 and
            prev_speed <= 8.0 and
            abs(prev_dy) <= 4.0 and
            speed_ratio >= 3.0 and
            angle_jump >= 50.0 and
            15.0 <= turn_dist <= max(75.0, prev_speed * 7.0) and
            abs(float(dy)) <= max(65.0, frame_height * 0.035)
        )
        if lateral_upper_racket_reversal:
            print(
                f"Frame {self.frame_count}: [UPPER LATERAL RACKET RETURN] "
                f"previous_hitter={self.player_names[last_contact_player]} "
                f"contact_player={self.player_names[candidate_player]} "
                f"origin={self.ball_center} new_pos={pos} "
                f"motion=({prev_dx:.1f},{prev_dy:.1f})->({float(dx):.1f},{float(dy):.1f}) "
                f"speed={prev_speed:.1f}x{speed_ratio:.1f} angle={angle_jump:.1f}"
            )
            return True

        # Original upper-apex/downward-return signature.  Preserve its bounce
        # requirement because this softer pattern lacks the strong horizontal
        # reversal and opponent-side ownership evidence used above.
        if self.ground_bounce_count <= 0:
            return False
        if dy < max(6.0, frame_height * 0.0035):
            return False
        recent_serve_return_window = (
            self.ground_bounce_count == 1 and
            (self.frame_count - getattr(self, '_last_serve_bounce_frame', -1000000)) <= 45
        )
        min_turn_angle = 65.0 if recent_serve_return_window else 70.0
        if angle_jump < min_turn_angle:
            return False
        if speed_ratio < 1.55:
            return False
        if turn_dist < 8.0 or turn_dist > max(60.0, prev_speed * 5.0):
            return False
        if abs(dx) > max(90.0, frame_width * 0.03):
            return False
        if motion_mean is not None and motion_max is not None:
            if motion_mean < 12.0 and motion_max < 70.0:
                return False
        return True

'''
          text = text[:start] + new + text[end:]
          path.write_text(text, encoding='utf-8')
          print('patched _upper_racket_contact_turn_candidate_ok')
          PY
      - name: Validate
        run: |
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          assert 'lateral_upper_racket_reversal = (' in text
          assert '[UPPER LATERAL RACKET RETURN]' in text
          def lateral(prev_dx, prev_dy, prev_speed, dx, dy, ratio, angle, turn_dist, opponent=True):
              return (
                  opponent and abs(prev_dx) >= 2.0 and abs(dx) >= 12.0 and
                  prev_dx * dx <= -24.0 and prev_speed <= 8.0 and
                  abs(prev_dy) <= 4.0 and ratio >= 3.0 and angle >= 50.0 and
                  15.0 <= turn_dist <= max(75.0, prev_speed * 7.0) and abs(dy) <= 65.0
              )
          assert lateral(3.0, -1.0, 3.2, -25.0, -26.0, 11.3, 62.3, 36.1)
          assert not lateral(3.0, -1.0, 3.2, 3.0, 8.0, 3.5, 55.0, 8.5)
          assert not lateral(3.0, -1.0, 3.2, -180.0, -20.0, 12.0, 90.0, 181.0)
          assert not lateral(3.0, -1.0, 3.2, -25.0, -26.0, 11.3, 62.3, 36.1, opponent=False)
          print('syntax, diff and generic lateral-hit signature validation passed')
          PY
          git diff -- interactive_ball_analyzer.py
      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Recognize lateral far-player racket returns"
          git push origin HEAD:revert_1
