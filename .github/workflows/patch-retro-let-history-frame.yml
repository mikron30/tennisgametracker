name: Fix retrospective let history frame linkage

on:
  push:
    branches: [revert_1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Apply history-frame patch
        run: python .github/patch_retro_let_history_frame.py

      - name: Test patch
        run: |
          python -m py_compile retro_let_scoring.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_retro_let_scoring.py

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-retro-let-history-frame.yml .github/patch_retro_let_history_frame.py
          git add retro_let_scoring.py tests/test_retro_let_scoring.py
          git commit -m "Link retrospective let rollback to history end frame"
          git push origin HEAD:revert_1
