name: Inspect recross and boundary internals

on:
  push:
    branches: [revert_1]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Print exact functions
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          lines = text.splitlines()
          wanted = {
              '_reset_side_recross_watch',
              '_start_point_context',
              '_maybe_infer_return_contact_from_side_recross',
              '_confirmed_boundary_reversal_out_candidate',
              '_record_serve_in',
          }
          for node in ast.walk(ast.parse(text)):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in wanted:
                  print(f'===== {node.name} lines {node.lineno}-{node.end_lineno} =====')
                  print('\n'.join(lines[node.lineno-1:node.end_lineno]))
          PY
