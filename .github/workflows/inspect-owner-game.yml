name: Fix rally out and missed-return ownership

on:
  push:
    branches: [revert_1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch analyzer and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          analyzer_path = Path('interactive_ball_analyzer.py')
          text = analyzer_path.read_text(encoding='utf-8')

          old = '''        point_start = getattr(self, 'point_start_frame_internal', None)
        last_hitter = getattr(self, '_last_racket_contact_player', None)
        last_contact_frame = int(getattr(self, '_last_racket_contact_frame', -1000000))
        if (
            point is None or
            point_start is None or
            last_hitter not in (0, 1) or
            last_contact_frame < int(point_start) or
            (int(self.frame_count) - last_contact_frame) < 6
        ):
            return False

        if getattr(self, '_side_recross_hitter', None) != last_hitter:
'''
          new = '''        point_start = getattr(self, 'point_start_frame_internal', None)
        if point is None or point_start is None:
            return False

        last_hitter = getattr(self, '_last_racket_contact_player', None)
        last_contact_frame = int(getattr(self, '_last_racket_contact_frame', -1000000))

        # The serve is a real stroke, but it is intentionally not counted as a
        # rally hit.  Use the server only as the trajectory owner when the
        # first receiver contact was visually missed.  A complete side recross
        # (several frames on the receiver side, then back to the server side)
        # is required before it becomes a real inferred rally contact.
        if last_hitter not in (0, 1) or last_contact_frame < int(point_start):
            context = getattr(self, '_point_history_current', None) or {}
            if int(getattr(self, '_point_hit_count', 0)) > 0 or context.get('shot_events'):
                return False
            try:
                last_hitter = int(context.get('server_idx', self._current_server_index()))
            except Exception:
                last_hitter = self._current_server_index()
            if last_hitter not in (0, 1):
                return False
            last_contact_frame = int(point_start)

        if (int(self.frame_count) - last_contact_frame) < 6:
            return False

        if getattr(self, '_side_recross_hitter', None) != last_hitter:
'''
          if old not in text:
              raise RuntimeError('side-recross ownership block not found')
          text = text.replace(old, new, 1)

          old = '''        points = []
        change_point = getattr(self, '_last_direction_change_point', None)
        if change_point is not None:
            points.append(tuple(change_point))
        points.append(tuple(ball_position))
'''
          new = '''        points = []
        change_point = getattr(self, '_last_direction_change_point', None)
        if change_point is not None:
            points.append(tuple(change_point))

        # At a bounce the current sample is already on the outgoing leg.  The
        # previous tracked position (current minus the outgoing motion vector)
        # is normally closer to the actual ground-contact point, so include it
        # in the same authoritative court-geometry check.  This is especially
        # important at a baseline where one frame after the bounce can already
        # be well back inside the image.  Racket-contact and line-contact gates
        # above/below remain authoritative, so this does not invent a new OUT
        # geometry rule.
        try:
            impact_x = float(ball_position[0]) - float(self.last_motion.get('dx', 0.0) or 0.0)
            impact_y = float(ball_position[1]) - float(self.last_motion.get('dy', 0.0) or 0.0)
            points.append((int(round(impact_x)), int(round(impact_y))))
        except Exception:
            pass
        points.append(tuple(ball_position))
'''
          if old not in text:
              raise RuntimeError('boundary reversal candidate list not found')
          text = text.replace(old, new, 1)
          analyzer_path.write_text(text, encoding='utf-8')

          tests_path = Path('tests/test_recovered_serve_scoring.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = 'def test_serve_seed_recovers_missed_returns_and_deciding_game'
          if marker in tests:
              raise RuntimeError('new regression tests already present')
          tests += '''


def test_pre_reversal_contact_point_is_checked_for_boundary_out(analyzer):
    start(analyzer, 100, (1800, 1000))
    analyzer._serve_phase_active = False
    analyzer._awaiting_serve_bounce = False
    analyzer.frame_count = 140
    analyzer.ball_center = (220, 180)
    analyzer.ball_size = 12.0
    analyzer.prev_motion = {'dx': 2, 'dy': 34, 'distance': math.hypot(2, 34)}
    analyzer.last_motion = {'dx': 20, 'dy': -40, 'distance': math.hypot(20, 40)}
    analyzer._last_direction_change_frame = analyzer.frame_count
    analyzer._last_direction_change_vertical_reversal = True
    # Deliberately make the stored change/current samples IN.  Only the
    # reconstructed pre-reversal contact (200, 220) is OUT.
    analyzer._last_direction_change_point = (220, 180)
    analyzer._point_outside_singles_court = lambda point, frame: (
        (True, 'far baseline', None, None, None, None)
        if tuple(point) == (200, 220)
        else (False, None, None, None, None, None)
    )
    analyzer._classify_ground_bounce = lambda point, frame: (
        (False, 'Ball bounce outside singles court (far baseline)', (0, 0, 255))
        if tuple(point) == (200, 220)
        else (True, 'Bounce in singles court', (255, 0, 0))
    )
    frame = np.zeros((1000, 1600, 3), dtype=np.uint8)
    ended, reason = analyzer._confirmed_boundary_reversal_out_candidate(analyzer.ball_center, frame)
    assert ended
    assert reason == 'Ball bounce outside singles court (far baseline)'


def test_serve_seed_recovers_missed_returns_and_deciding_game(analyzer):
    analyzer.score_games = [0, 0]
    analyzer.score_points = [1, 3]  # P1 15 : P2 40
    analyzer._current_server_index = lambda: 0
    start(analyzer, 100, (1800, 1000))
    analyzer._serve_phase_active = False
    analyzer._awaiting_serve_bounce = False
    analyzer._player_index_at_point = lambda point, frame=None: 0 if point[1] > 500 else 1
    frame = np.zeros((1000, 1600, 3), dtype=np.uint8)

    # No racket contact is detected.  The serve seeds P1 as trajectory owner;
    # three far-side frames followed by two near-side frames prove P2 returned.
    for f in (110, 111, 112):
        analyzer.frame_count = f
        assert not analyzer._maybe_infer_return_contact_from_side_recross((700, 250), frame)
    analyzer.frame_count = 113
    assert not analyzer._maybe_infer_return_contact_from_side_recross((700, 750), frame)
    analyzer.frame_count = 114
    assert analyzer._maybe_infer_return_contact_from_side_recross((700, 750), frame)
    assert analyzer._last_racket_contact_player == 1
    assert analyzer._point_hit_count == 1

    # After P2's inferred return, the same symmetric recross proves P1 hit it
    # back toward the far baseline even if that racket contact was also hidden.
    for f in (120, 121, 122):
        analyzer.frame_count = f
        assert not analyzer._maybe_infer_return_contact_from_side_recross((720, 760), frame)
    analyzer.frame_count = 123
    assert not analyzer._maybe_infer_return_contact_from_side_recross((730, 260), frame)
    analyzer.frame_count = 124
    assert analyzer._maybe_infer_return_contact_from_side_recross((740, 250), frame)
    assert analyzer._last_racket_contact_player == 0
    assert analyzer._point_hit_count == 2

    # P1 was the last hitter and the ball lands OUT on P2's far side.  At
    # 15:40 this must award P2 the game, reset point score, and advance games.
    analyzer.frame_count = 125
    analyzer._record_point_result(
        'Ball bounce outside singles court (far baseline)',
        (740, 220),
        frame=frame,
    )
    assert analyzer.score_games == [0, 1]
    assert analyzer.score_points == [0, 0]
    assert analyzer._score_summary() == '0:1 0:0'
'''
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python -m py_compile interactive_ball_analyzer.py tests/test_recovered_serve_scoring.py
          git diff --check

      - name: Run focused regression tests
        shell: bash
        run: |
          python -m pytest tests/test_recovered_serve_scoring.py -q

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-owner-game.yml
          git add interactive_ball_analyzer.py tests/test_recovered_serve_scoring.py
          git commit -m "End deciding rally out and infer missed returns"
          git push origin HEAD:revert_1
