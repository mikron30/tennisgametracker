name: Fix rally out and missed-return ownership

on:
  push:
    branches: [revert_1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch analyzer and regressions
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          payload = ''
          open('/tmp/patch.py', 'wb').write(zlib.decompress(base64.b64decode(payload)))
          PY
          python /tmp/patch.py
          python -m py_compile interactive_ball_analyzer.py tests/test_recovered_serve_scoring.py
          git diff --check
      - name: Run focused regression tests
        shell: bash
        run: python -m pytest tests/test_recovered_serve_scoring.py -q
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-owner-game.yml
          git add interactive_ball_analyzer.py tests/test_recovered_serve_scoring.py
          git commit -m "End deciding rally out and infer missed returns"
          git push origin HEAD:revert_1
