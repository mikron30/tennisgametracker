name: Remove video-specific frame logic

on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/remove-specific-frame-logic.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Remove absolute-frame exceptions
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re

          path = Path('interactive_ball_analyzer.py')
          src = path.read_text(encoding='utf-8')
          original = src

          # Remove whole methods whose only purpose is source-video/frame-specific correction.
          remove_functions = {
              '_reconcile_verified_caught_toss_history_row',
              '_point_timeout_result_override',
              '_reference_point_end_targets',
              '_reference_point_end_target',
              '_reviewed_point_continuation_frame',
              '_reference_point_end_override',
              '_is_reviewed_false_serve_start',
              '_seed_match_state_from_start_frame',
              '_sync_court2_video_phase_from_frame',
              '_court2_false_serve_start_override',
          }
          remove_attrs = {
              '_serve_history_reconciliation',
              '_start_frame_match_seed_applied',
              '_court2_video_phase_seed_applied',
          }

          tree = ast.parse(src)
          spans = []
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in remove_functions:
                  spans.append((node.lineno, node.end_lineno))
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  hit = False
                  for target in targets:
                      for sub in ast.walk(target):
                          if isinstance(sub, ast.Attribute) and sub.attr in remove_attrs:
                              hit = True
                              break
                      if hit:
                          break
                  if hit:
                      spans.append((node.lineno, node.end_lineno))

          spans = sorted(spans)
          merged = []
          for a, b in spans:
              if merged and a <= merged[-1][1] + 1:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], b))
              else:
                  merged.append((a, b))
          lines = src.splitlines(keepends=True)
          for a, b in reversed(merged):
              del lines[a-1:b]
          src = ''.join(lines)

          # Remove constructor/CLI plumbing for the deleted switch.
          src = re.sub(r'^\s*disable_specific_frame_logic: bool = False,\n', '', src, flags=re.M)
          src = re.sub(r'^\s*self\.disable_specific_frame_logic = bool\(disable_specific_frame_logic\)\n', '', src, flags=re.M)
          src = re.sub(
              r'^\s*parser\.add_argument\("--disable-specific-frame-logic", action="store_true",\n'
              r'^\s*help="Disable reviewed and exact-frame tracking exceptions"\)\n',
              '', src, flags=re.M
          )
          src = re.sub(r'^\s*disable_specific_frame_logic=args\.disable_specific_frame_logic,\n', '', src, flags=re.M)

          # Remove calls to methods that no longer exist.
          src = re.sub(r'^\s*row = self\._reconcile_verified_caught_toss_history_row\(row\)\n', '', src, flags=re.M)
          src = re.sub(r'^\s*self\._seed_match_state_from_start_frame\(\)\n', '', src, flags=re.M)
          src = re.sub(r'^\s*self\._sync_court2_video_phase_from_frame\(\)\n', '', src, flags=re.M)

          # Keep generic provisional-serve confirmation; remove court/video-range override.
          src = src.replace(
              "        if self._court2_false_serve_start_override(reason):\n            return True\n",
              ""
          )

          # Remove reviewed endpoint/continuation checks from both point-end implementations.
          src = re.sub(
              r'        reference_override = self\._reference_point_end_override\(\)\n'
              r'.*?        if \(reference_target is not None and\n'
              r"                self\.frame_count < int\(reference_target\['point_end_frame'\]\)\):\n"
              r'            return False, "Reviewed endpoint hold"\n',
              '', src, count=2, flags=re.S
          )

          # Remove reviewed false-start + reference-end state-machine block entirely.
          src = re.sub(
              r'                # Reject a source-reviewed false serve immediately\..*?'
              r'                # Point duration timeout:',
              '                # Point duration timeout:',
              src, count=1, flags=re.S
          )
          src = re.sub(r'^\s*not reference_target_hold\):\n', '                        True):\n', src, count=1, flags=re.M)

          # Remove reference/timeout overrides from point recording; use physical/general rules only.
          src = re.sub(
              r'        if outcome is None:\n'
              r'            reference_override = self\._reference_point_end_override\(\)\n'
              r'.*?            elif self\._is_serve_let_reason\(reason\):\n',
              '        if outcome is None:\n            if self._is_serve_let_reason(reason):\n',
              src, count=1, flags=re.S
          )

          # Delete the one-off frame-127 HSV reversal. Normal HSV/alternate logic remains.
          src = re.sub(
              r'            use_alt_first = \(\n'
              r'.*?'
              r'            alt_upper = hsv_upper_use if use_alt_first and self\.alt_hsv_lower is not None else self\.alt_hsv_upper\n',
              '            primary_lower = hsv_lower_use\n'
              '            primary_upper = hsv_upper_use\n'
              '            alt_lower = self.alt_hsv_lower\n'
              '            alt_upper = self.alt_hsv_upper\n',
              src, count=1, flags=re.S
          )
          src = src.replace(
              "if alt_upper is not None and (alt_upper[0] != primary_upper[0] or use_alt_first):",
              "if alt_upper is not None and alt_upper[0] != primary_upper[0]:"
          )

          # Convert old absolute-frame debug windows to normal verbose-debug behavior.
          src = src.replace("if 1170 <= self.frame_count <= 1200:", "if getattr(self, 'verbose_debug', False):")
          src = src.replace("if 12740 <= self.frame_count <= 12790:", "if getattr(self, 'verbose_debug', False):")
          src = re.sub(
              r'^\s*elif 1165 <= self\.frame_count <= 1185:\n'
              r'^\s*print\(f"\[STATE_STUCK\].*?\)\n',
              '', src, count=1, flags=re.M
          )

          # Remove old source-video absolute frame references from comments/docstrings too.
          src = re.sub(r'\bf\d{3,}\b', 'a prior frame', src)
          src = re.sub(r'\bframe \d{3,}\b', 'a prior frame', src, flags=re.I)
          src = src.replace('source-reviewed', 'previously reviewed')
          src = src.replace('source video', 'video')
          src = src.replace('source-video', 'video')

          if src == original:
              raise SystemExit('Patch made no changes')
          path.write_text(src, encoding='utf-8')
          PY

      - name: Validate syntax and absence of absolute-frame exceptions
        run: |
          python -m py_compile interactive_ball_analyzer.py
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          forbidden=[
              'disable_specific_frame_logic',
              '--disable-specific-frame-logic',
              '_serve_history_reconciliation',
              '_start_frame_match_seed_applied',
              '_court2_video_phase_seed_applied',
              '_seed_match_state_from_start_frame',
              '_sync_court2_video_phase_from_frame',
              '_is_reviewed_false_serve_start',
              '_court2_false_serve_start_override',
              '_reference_point_end_targets',
              '_reference_point_end_target',
              '_reference_point_end_override',
              '_reviewed_point_continuation_frame',
              '_point_timeout_result_override',
              'REFERENCE_POINT_END',
              'Reviewed endpoint hold',
              'Reviewed continuation hold',
          ]
          bad=[x for x in forbidden if x in src]

          # Only direct frame-variable-to-literal comparisons are forbidden.
          # Relative expressions such as point_anchor + 240 < frame_count are generic and valid.
          direct_patterns=[
              r'(?:self\.)?(?:frame_count|start_frame|tracking_start_frame|serve_start_frame|point_start_frame_internal)\s*(?:==|!=|<=|>=|<|>)\s*\d{3,}',
              r'(?<![\w+\-*/])\d{3,}\s*(?:==|!=|<=|>=|<|>)\s*(?:self\.)?(?:frame_count|tracking_start_frame|serve_start_frame|point_start_frame_internal)',
          ]
          direct=[]
          for pat in direct_patterns:
              direct.extend(m.group(0) for m in re.finditer(pat,src))
          textual=[]
          textual.extend(re.findall(r'\bf\d{3,}\b',src))
          textual.extend(re.findall(r'\bframe \d{3,}\b',src,re.I))
          if bad or direct or textual:
              print('FORBIDDEN SYMBOLS:',bad)
              print('ABSOLUTE FRAME COMPARISONS:',direct[:50])
              print('TEXTUAL ABSOLUTE FRAME REFS:',textual[:50])
              raise SystemExit(2)
          print('Specific-frame validation passed')
          PY

      - name: Commit production cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Remove video-specific frame exceptions"
          git push origin HEAD:revert_1
