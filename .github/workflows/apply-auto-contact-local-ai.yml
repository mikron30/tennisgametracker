name: Clean automatic contact Local AI temp files

on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/apply-auto-contact-local-ai.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 1
      - name: Remove temporary inspection and patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/contact_ai_context.txt \
            .github/workflows/inspect-contact-ai-flow.yml \
            .github/contact_ai_flow_context.txt \
            .github/scripts/apply_auto_contact_local_ai.py \
            .github/workflows/apply-auto-contact-local-ai.yml
          git commit -m "Remove temporary automatic contact AI files"
          git push origin HEAD:revert_1
