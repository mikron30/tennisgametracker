name: Patch post-serve trajectory corridor

on:
  push:
    branches: [revert_1]
    paths:
      - '.github/scripts/patch_post_serve_trajectory_corridor.py'
      - '.github/workflows/patch-post-serve-trajectory-corridor.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --quiet numpy opencv-python-headless

      - name: Apply general post-serve trajectory corridor patch
        run: |
          python .github/scripts/patch_post_serve_trajectory_corridor.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_serve_launch_handoff.py')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate syntax and whitespace
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py tests/test_serve_launch_handoff.py
          git diff --check

      - name: Run serve and player-contact regression suite
        env:
          PYTHONPATH: tests
        run: python -m unittest -v test_serve_launch_handoff

      - name: Commit tested source and clean temporary inspection files
        run: |
          rm -f .github/scripts/inspect_post_serve_corridor.py
          rm -f .github/scripts/post_serve_corridor_context.txt
          rm -f .github/scripts/post_serve_trajectory_function.txt
          rm -f .github/workflows/inspect-post-serve-corridor.yml
          rm -f .github/scripts/patch_post_serve_trajectory_corridor.py
          rm -f .github/workflows/patch-post-serve-trajectory-corridor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use post-serve trajectory uncertainty corridor"
          git push origin HEAD:revert_1
