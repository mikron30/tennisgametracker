name: Verify current generic contact AI source
on:
  push:
    branches:
      - revert_1
    paths:
      - .github/workflows/verify-contact-ai-current.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py
          python - <<'PY'
          from pathlib import Path
          s=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          checks=[
            '_contact_local_ai_watch_until_frame',
            '[CONTACT_LOCAL_AI_FALLBACK]',
            '[CONTACT_LOCAL_AI_MISS]',
            '[FORCE_LOCAL_AI_MISS]',
            '_force_local_ai_max_score_candidates',
            '_force_local_ai_return_none_on_miss',
          ]
          for x in checks:
              print(x, s.count(x))
          print('OLD_UNCONDITIONAL_PLAYER_ZONE', s.count("if zone in player_zones and max(prior_speed, proposed_speed) >= 12.0:"))
          print('OLD_HOLD_COMMENT', s.count('Hold the last trusted ball and retry'))
          print('DISABLE_SPECIFIC', s.count('disable_specific_frame_logic'))
          PY
