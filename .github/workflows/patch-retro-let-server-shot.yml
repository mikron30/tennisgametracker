name: Patch retrospective let server shot

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_retro_let_server_shot.py

      - name: Test patch
        run: |
          python -m py_compile retro_let_scoring.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_retro_let_scoring.py

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-retro-let-server-shot.yml
          git rm .github/scripts/patch_retro_let_server_shot.py
          git add retro_let_scoring.py tests/test_retro_let_scoring.py
          git commit -m "Close retrospective let after server continuation"
          git push origin HEAD:revert_1
