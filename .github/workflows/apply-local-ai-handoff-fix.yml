name: Apply Local AI handoff fix
on:
  push:
    branches: [revert_1]
    paths:
      - tools/_tmp_patch_local_ai_handoff.py
      - .github/workflows/apply-local-ai-handoff-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Patch source
        run: python tools/_tmp_patch_local_ai_handoff.py
      - name: Validate syntax
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py tests/test_ball_local_ai_recovery.py
          git diff --check
      - name: Run Local AI tests
        run: python -m unittest tests.test_ball_local_ai_recovery
      - name: Verify generic handoff rules
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          assert '[LOCAL_AI_HANDOFF_STALL]' in s
          assert 'player-region:handoff-stall' in s
          assert '[LOCAL_AI_POINT_END_BOUNDARY_OVERRIDE]' in s
          assert '_confirmed_boundary_reversal_out_candidate' in s
          assert '12888' not in s[s.find('[LOCAL_AI_HANDOFF_STALL]')-1000:s.find('[LOCAL_AI_HANDOFF_STALL]')+1000]
          assert '12890' not in s[s.find('[LOCAL_AI_POINT_END_BOUNDARY_OVERRIDE]')-1000:s.find('[LOCAL_AI_POINT_END_BOUNDARY_OVERRIDE]')+1000]
          print('verified generic handoff stall + boundary override')
          PY
      - name: Commit source and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch tools/_tmp_patch_local_ai_handoff.py .github/workflows/apply-local-ai-handoff-fix.yml
          git add interactive_ball_analyzer.py
          git diff --cached --check
          git commit -m "Let trajectory AI bridge handoff stalls and boundary outs"
          git push origin HEAD:revert_1
