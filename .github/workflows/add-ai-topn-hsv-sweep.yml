name: Add AI Top-N and HSV sweep debug

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch analyzer
        run: python .github/scripts/patch_ai_topn_hsv_debug.py

      - name: Validate
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-ai-topn-hsv-sweep.yml
          git rm .github/scripts/patch_ai_topn_hsv_debug.py
          git add interactive_ball_analyzer.py
          git diff --cached --check
          git commit -m "Add Top-N Local AI and HSV sweep debug"
          git push origin HEAD:revert_1
