name: One-shot serve phase state fix

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_serve_phase.py
          python /tmp/patch_serve_phase.py
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-serve-phase-leak.yml
          git add interactive_ball_analyzer.py
          git commit -m "Fix serve state leaking into rally"
          git push origin HEAD:revert_1
