name: Run contact AI freeze patcher
on:
  push:
    branches: [revert_1]
    paths: [.github/workflows/run-contact-ai-freeze-patcher.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_contact_ai_freeze.py
      - name: Validate
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py
          python - <<'PY'
          from pathlib import Path
          s=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          assert 'disable_specific_frame_logic' not in s
          assert '--disable-specific-frame-logic' not in s
          assert '[CONTACT_LOCAL_AI_FALLBACK]' in s
          assert '[CONTACT_LOCAL_AI_MISS]' in s
          assert '_force_local_ai_max_score_candidates' in s
          assert '_contact_local_ai_watch_until_frame' in s
          print('CONTACT_AI_GENERIC_FIX_OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Make racket-contact Local AI non-blocking"
          git push origin HEAD:revert_1
# current-head-run
