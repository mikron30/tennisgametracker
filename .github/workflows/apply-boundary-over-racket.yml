name: Apply boundary over racket
on:
  push:
    branches: [revert_1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Patch source
        run: python tools/_tmp_patch_boundary_over_racket.py
      - name: Validate syntax
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py ball_ai_recovery_probe.py
          git diff --check
      - name: Run Local AI tests
        run: python -m unittest tests.test_ball_local_ai_recovery
      - name: Verify generic rule
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          assert 'BOUNDARY-BEATS-RACKET' in s
          assert '_boundary_reversal_should_stay_ground_bounce' in s
          block=s[s.index('def _boundary_reversal_should_stay_ground_bounce'):s.index('def _ground_bounce_has_racket_below_contact')]
          assert '12889' not in block
          print('verified geometry-only boundary precedence')
          PY
      - name: Commit source and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch tools/_tmp_patch_boundary_over_racket.py .github/workflows/inspect-far-player-contact.yml .github/workflows/apply-boundary-over-racket.yml
          git add interactive_ball_analyzer.py
          git diff --cached --check
          git commit -m "Prioritize boundary reversals over racket inference"
          git push origin HEAD:revert_1
