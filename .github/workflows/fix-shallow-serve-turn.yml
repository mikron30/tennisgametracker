name: Validate shallow serve turn recognition

on:
  push:
    branches: [codex-ai-recovery-wip, codex/shallow-serve-turn-candidate]
  pull_request:
    branches: [codex-ai-recovery-wip]

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run focused regressions
        run: >-
          python -m pytest -q
          tests/test_shallow_serve_turn_service_line.py
          tests/test_recovered_serve_scoring.py
          tests/test_ai_physical_validation.py
          tests/test_tracking_audit.py
          tests/test_out_bounce_motion_consistency.py
          tests/test_night_serve_geometry.py
          tests/test_out_bounce_verification.py
          tests/test_tracking_evidence.py
