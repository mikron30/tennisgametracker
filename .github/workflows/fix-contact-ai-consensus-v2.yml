name: Fix contact AI consensus v2

on:
  push:
    branches: [codex-ai-recovery-wip]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-ai-recovery-wip
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install -r requirements.txt pytest
      - name: Apply patch script
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Run focused regressions
        run: |
          python -m py_compile interactive_ball_analyzer.py ball_local_ai_recovery.py
          python -m unittest tests.test_ai_physical_validation tests.test_ball_local_ai_recovery tests.test_retro_let_scoring tests.test_serve_side_consistency
          python -m pytest -q tests/test_recovered_serve_scoring.py
          git diff --check
      - name: Commit validated fix
        run: |
          rm -f .github/workflows/fix-contact-ai-consensus.yml .github/workflows/fix-contact-ai-consensus-v2.yml
          git config user.name 'chatgpt-ai-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A interactive_ball_analyzer.py tests/test_ai_physical_validation.py .github/workflows/fix-contact-ai-consensus.yml .github/workflows/fix-contact-ai-consensus-v2.yml
          git commit -m 'Prefer corroborated contact AI candidate on first frame'
          git push origin HEAD:codex-ai-recovery-wip
