name: Apply pause-at-frame support

on:
  push:
    branches:
      - revert_1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revert_1
        uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0

      - name: Patch interactive_ball_analyzer.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("interactive_ball_analyzer.py")
          raw = path.read_bytes()
          text = raw.decode("utf-8")
          nl = "\r\n" if "\r\n" in text else "\n"

          if "--pause-at-frame" not in text:
              start_frame_block = (
                  '    parser.add_argument("--start-frame", type=int, default=0,' + nl +
                  '                        help="Frame index to start from (default 0)")'
              )
              if text.count(start_frame_block) != 1:
                  raise RuntimeError("Expected exactly one --start-frame parser block")
              pause_arg = (
                  start_frame_block + nl +
                  '    parser.add_argument("--pause-at-frame", type=int, default=None,' + nl +
                  '                        help="Automatically pause once when this frame is reached")'
              )
              text = text.replace(start_frame_block, pause_arg, 1)

              play_anchor = '        play_mode = auto_play  # start playing immediately if --auto-play flag is set'
              if text.count(play_anchor) != 1:
                  raise RuntimeError("Expected exactly one play_mode initialization")
              text = text.replace(
                  play_anchor,
                  play_anchor + nl + '        pause_at_frame_triggered = False',
                  1,
              )

              key_anchor = (
                  "            if not getattr(self, 'auto_play', False) and not self.headless:" + nl +
                  '                if self.pause_requested:' + nl +
                  '                    play_mode = False'
              )
              if text.count(key_anchor) != 1:
                  raise RuntimeError("Expected exactly one main keyboard wait block")
              key_replacement = (
                  "            if not getattr(self, 'auto_play', False) and not self.headless:" + nl +
                  "                pause_at_frame = getattr(self, 'pause_at_frame', None)" + nl +
                  '                if (pause_at_frame is not None and not pause_at_frame_triggered' + nl +
                  '                        and self.frame_count >= pause_at_frame):' + nl +
                  '                    play_mode = False' + nl +
                  '                    pause_at_frame_triggered = True' + nl +
                  '                    print(f"[PAUSE_AT_FRAME] Paused at frame {self.frame_count}")' + nl +
                  '                if self.pause_requested:' + nl +
                  '                    play_mode = False'
              )
              text = text.replace(key_anchor, key_replacement, 1)

              run_anchor = '                result = analyzer.process_video(auto_play=args.auto_play, max_frames=max_frames_for_run)'
              if text.count(run_anchor) != 1:
                  raise RuntimeError("Expected exactly one analyzer.process_video call")
              run_replacement = (
                  '                analyzer.pause_at_frame = args.pause_at_frame if sequence_index == 0 else None' + nl +
                  run_anchor
              )
              text = text.replace(run_anchor, run_replacement, 1)

              path.write_bytes(text.encode("utf-8"))
              print("Applied --pause-at-frame support")
          else:
              print("--pause-at-frame already present; no source patch needed")
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/apply-pause-at-frame.yml
          git add interactive_ball_analyzer.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add pause-at-frame debugging flag"
          git push origin HEAD:revert_1
