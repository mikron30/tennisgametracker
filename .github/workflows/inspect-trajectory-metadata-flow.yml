name: Inspect trajectory metadata flow

on:
  push:
    branches:
      - revert_1
    paths:
      - '.github/scripts/inspect_trajectory_metadata_flow.py'
      - '.github/workflows/inspect-trajectory-metadata-flow.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect metadata flow
        run: python .github/scripts/inspect_trajectory_metadata_flow.py
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/trajectory_metadata_flow.txt
          git commit -m "Capture trajectory metadata flow"
          git push origin HEAD:revert_1
