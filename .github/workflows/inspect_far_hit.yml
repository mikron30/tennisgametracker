name: Fix far-side return recognition
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_far_hit.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Patch far-side hit detector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('interactive_ball_analyzer.py')
          text = path.read_text(encoding='utf-8')

          old_early = """        if self.ball_center is None or self.last_motion is None or self.ball_size is None:\n            return False\n        if getattr(self, '_awaiting_serve_bounce', False):\n            return False\n        if getattr(self, 'direction_change_streak', 0) < 2:\n            return False\n\n        frame_height, frame_width = frame_shape[:2]\n"""
          new_early = """        if self.ball_center is None or self.last_motion is None or self.ball_size is None:\n            return False\n\n        frame_height, frame_width = frame_shape[:2]\n"""
          if text.count(old_early) != 1:
              raise SystemExit(f'upper-contact early gate expected once, found {text.count(old_early)}')
          text = text.replace(old_early, new_early, 1)

          old_owner = """        opponent_contact_side = (\n            active_previous_hit and\n            candidate_player in (0, 1) and\n            candidate_player != last_contact_player\n        )\n\n        # Gravity can reverse vertical motion at an apex, but cannot reverse\n"""
          new_owner = """        opponent_contact_side = (\n            active_previous_hit and\n            candidate_player in (0, 1) and\n            candidate_player != last_contact_player\n        )\n\n        # Missing the service-box bounce must not leave the tracker permanently\n        # in serve-bounce mode once a verified racket hit from this active point\n        # already exists.  That stale state used to suppress every far-player\n        # return even when the ball stalled on the opponent side and launched\n        # away with a clear horizontal reversal.  Keep the serve guard only\n        # before any rally contact has been established.\n        if getattr(self, '_awaiting_serve_bounce', False) and not active_previous_hit:\n            return False\n\n        # Gravity can reverse vertical motion at an apex, but cannot reverse\n"""
          if text.count(old_owner) != 1:
              raise SystemExit(f'upper-contact ownership block expected once, found {text.count(old_owner)}')
          text = text.replace(old_owner, new_owner, 1)

          old_after_lateral = """            return True\n\n        # Preserve the older, softer apex/downward-return signature. Because it\n        # lacks the strong horizontal reversal above, retain its bounce gate.\n        if self.ground_bounce_count <= 0:\n            return False\n"""
          new_after_lateral = """            return True\n\n        # The strict lateral reversal above is self-confirming and must not\n        # depend on how many provisional direction-change hold frames happened\n        # before it.  Keep the hold requirement only for the older, softer\n        # apex/downward-return signature.\n        if getattr(self, 'direction_change_streak', 0) < 2:\n            return False\n\n        # Preserve the older, softer apex/downward-return signature. Because it\n        # lacks the strong horizontal reversal above, retain its bounce gate.\n        if self.ground_bounce_count <= 0:\n            return False\n"""
          if text.count(old_after_lateral) != 1:
              raise SystemExit(f'upper-contact post-lateral block expected once, found {text.count(old_after_lateral)}')
          text = text.replace(old_after_lateral, new_after_lateral, 1)

          path.write_text(text, encoding='utf-8')
          print('Generic far-side return patch applied')
          PY
      - name: Validate
        run: |
          python -m py_compile interactive_ball_analyzer.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import math

          text = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8')
          stale_guard = "if getattr(self, '_awaiting_serve_bounce', False) and not active_previous_hit:"
          lateral = 'if lateral_upper_racket_reversal:'
          hold = "if getattr(self, 'direction_change_streak', 0) < 2:"
          assert stale_guard in text
          assert text.index(lateral) < text.index(hold), 'strong lateral return must be checked before hold gate'

          # Generic reviewed signature: a tiny/slowed ball on the opponent end
          # reverses horizontal direction and accelerates sharply.  These are
          # the measured motion values from the failing pattern, not frame IDs.
          def strong_lateral(prev_dx, prev_dy, prev_speed, dx, dy, speed, angle):
              ratio = speed / prev_speed if prev_speed else 999.0
              turn = math.hypot(dx, dy)
              return (
                  abs(prev_dx) >= 2.0 and abs(dx) >= 12.0 and
                  prev_dx * dx <= -24.0 and prev_speed <= 8.0 and
                  abs(prev_dy) <= 4.0 and ratio >= 3.0 and angle >= 50.0 and
                  15.0 <= turn <= max(75.0, prev_speed * 7.0) and abs(dy) <= 75.6
              )
          assert strong_lateral(3.0, -1.0, 3.2, -25.0, -26.0, 36.1, 62.3)
          assert not strong_lateral(3.0, -1.0, 3.2, 5.0, 2.0, 5.4, 37.7), 'ordinary apex drift must stay rejected'
          assert not strong_lateral(-10.0, -2.0, 10.2, -20.0, 5.0, 20.6, 20.0), 'same-direction flight must stay rejected'
          print('Syntax, ordering and generic motion checks passed')
          PY
          git diff -- interactive_ball_analyzer.py
      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_ball_analyzer.py
          git commit -m "Recognize far-side returns after missed serve bounce"
          git push origin HEAD:revert_1
