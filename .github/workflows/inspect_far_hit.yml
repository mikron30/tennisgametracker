name: Capture far-side hit inspection
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_far_hit.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
          fetch-depth: 0
      - name: Capture exact source ranges
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('interactive_ball_analyzer.py').read_text(encoding='utf-8').splitlines()
          ranges=[(12260,12620),(20450,20680)]
          out=[]
          for a,b in ranges:
              out.append(f'===== LINES {a+1}-{b} =====')
              out.extend(f'{j+1:06d}: {src[j]}' for j in range(a,min(b,len(src))))
          Path('.github/inspect_far_hit_output3.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/inspect_far_hit_output3.txt
          git commit -m "Capture far hit exact ranges"
          git push origin HEAD:revert_1
