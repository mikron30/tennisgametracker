name: Inspect far hit detector
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_far_hit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Show ownership and contact state
        run: |
          echo '=== COURT END MAPPING ==='
          grep -n -C 70 "def _player_index_on_court_end" interactive_ball_analyzer.py || true
          grep -n -C 70 "def _court_end_for_point" interactive_ball_analyzer.py || true
          echo '=== RECORD CONTACT ==='
          grep -n -C 100 "def _record_racket_contact" interactive_ball_analyzer.py || true
          echo '=== AWAIT SERVE BOUNCE ==='
          grep -n -C 30 "_awaiting_serve_bounce = False" interactive_ball_analyzer.py | head -n 500 || true
          echo '=== DIRECTION STREAK ==='
          grep -n -C 15 "direction_change_streak = 0" interactive_ball_analyzer.py | head -n 300 || true
