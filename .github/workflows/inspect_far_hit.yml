name: Inspect far hit detector
on:
  push:
    branches: [revert_1]
    paths: ['.github/workflows/inspect_far_hit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert_1
      - name: Show upper/far contact gates
        run: |
          echo '=== CORE 20550-20970 ==='
          sed -n '20550,20970p' interactive_ball_analyzer.py
          echo '=== UPPER RACKET DEFINITIONS ==='
          grep -n -C 100 "upper_racket_contact_turn_candidate" interactive_ball_analyzer.py || true
          echo '=== UPPER SLOW ARC DEFINITIONS ==='
          grep -n -C 100 "upper_slow_arc_candidate" interactive_ball_analyzer.py || true
          echo '=== SIDE RECROSS CALLERS ==='
          grep -n -C 40 "_maybe_infer_return_contact_from_side_recross" interactive_ball_analyzer.py || true
          echo '=== PLAYER ZONE HELPERS ==='
          grep -n -C 60 "def _player_point_zone" interactive_ball_analyzer.py || true
